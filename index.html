// --- GRID VIEW ---
// --- MOBILE GRID VIEW (day-pill + card list, swapped in below the responsive breakpoint) ---
var MOBILE_BREAKPOINT = 760;
function isMobileView() { return window.innerWidth < MOBILE_BREAKPOINT; }

function gmCard(s, d, flaggedCells) {
  var schedSh = getEffectiveShift(s.id, d, ST.sched) || s.sh;
  var cd = getCellData(s.id, d);
  var cellStatus = cd.status;
  var sh = (cellStatus === "OFF" || cellStatus === "ABSENT" || cellStatus === "HALFDAY" || cellStatus === "NODUTY" || cellStatus === "VACATION") ? cellStatus : schedSh;
  var off = (sh === "OFF"), absent = (sh === "ABSENT"), half = (sh === "HALFDAY"), noduty = (sh === "NODUTY"), vacation = (sh === "VACATION");
  var notWorking = off || absent || noduty || vacation;
  var inM = isInMonth(d);
  var g = GROUPS[s.g] || {color: "#888"};
  var effBranch = notWorking ? s.g : getEffectiveBranch(s.id, d);
  var branchChanged = !notWorking && effBranch !== s.g;
  var isFlagged = !!flaggedCells[s.id + "_" + d];

  var ctrs = cd.ctrs || [];
  var hasManualCtr = ctrs.some(function(c) { return c && c.ctr && c.ctr !== "None"; });
  var ctrText = "";
  if (hasManualCtr) {
    ctrText = ctrs.filter(function(c) { return c && c.ctr && c.ctr !== "None"; }).map(function(c) { return c.ctr; }).join(", ");
  } else {
    var autoCtr = getC(s.id, d);
    if (autoCtr && autoCtr !== "None") ctrText = autoCtr;
  }

  var statusLabel, statusColor;
  if (off) { statusLabel = cd.nextMonthOff ? (nextMonthLabelFor(d) + " off (early)") : "OFF today"; statusColor = "#ffb020"; }
  else if (absent) { statusLabel = "Absent"; statusColor = "#ff5d7a"; }
  else if (noduty) { statusLabel = "No duty today"; statusColor = "#94a3b8"; }
  else if (vacation) { statusLabel = "On vacation"; statusColor = "#c084fc"; }
  else if (half) { statusLabel = "Half day" + (cd.half && cd.half.from ? (" " + cd.half.from + "-" + cd.half.to) : ""); statusColor = "#60a5fa"; }
  else if (!inM) { statusLabel = "Shift " + sh + " (outside range)"; statusColor = "#4f8ba1"; }
  else { statusLabel = "Shift " + sh + " \u00b7 " + (SD[sh] ? SD[sh].t : ""); statusColor = "#86a9bb"; }

  return '<div style="position:relative;margin-bottom:8px;">'
    + '<button class="ce-open gm-card" data-sid="' + s.id + '" data-d="' + d + '" style="display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#04202e;border:1px solid ' + (isFlagged ? "#ff5d7a" : LN) + ';' + (isFlagged ? "animation:issuePulse 1.6s ease-in-out infinite;" : "") + 'border-left:3px solid ' + g.color + ';border-radius:10px;padding:11px 12px;opacity:' + (inM ? 1 : 0.55) + ';cursor:pointer;font-family:var(--font-display);">'
    + '<div style="width:36px;height:36px;border-radius:50%;background:' + g.color + '22;border:1px solid ' + g.color + '77;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:' + g.color + ';flex-shrink:0;">' + s.nm.slice(0, 2) + '</div>'
    + '<div style="flex:1;min-width:0;">'
      + '<div style="font-size:12.5px;font-weight:700;color:#eafbff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + s.nm + (s.rv ? ' <span style="color:#2fe6a7;font-size:9px;">R</span>' : '') + '</div>'
      + '<div style="font-size:10px;color:' + statusColor + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (branchChanged ? ('&rarr; ' + GROUPS[effBranch].nm + ' \u00b7 ') : '') + statusLabel + '</div>'
    + '</div>'
    + '<div style="text-align:right;flex-shrink:0;padding-right:26px;">'
      + (ctrText ? '<div style="font-size:10px;font-weight:800;color:' + (hasManualCtr ? "#60a5fa" : "#00c2ff") + ';font-family:var(--font-mono);">' + ctrText + '</div>' : '')
      + '<div style="font-size:8.5px;color:#4f8ba1;margin-top:1px;">tap to edit</div>'
    + '</div>'
  + '</button>'
  + '<button class="bulk-open" data-sid="' + s.id + '" title="Bulk edit a date range" style="position:absolute;top:8px;right:8px;background:rgba(124,58,237,.18);border:1px solid #7c3aed77;color:#c4b5fd;font-size:8px;font-weight:700;padding:4px 7px;border-radius:5px;">BULK</button>'
  + '</div>';
}

function bGridMobile() {
  var days = wkDays(ST.week);
  var todayIdx = getTodayIdx();
  var selDay = (ST.mobileSelDay !== undefined && days.indexOf(ST.mobileSelDay) !== -1) ? ST.mobileSelDay : (days.indexOf(todayIdx) !== -1 ? todayIdx : days[0]);
  ST.mobileSelDay = selDay;

  var scheduleIssues = computeScheduleIssues();
  var flaggedCells = {};
  scheduleIssues.forEach(function(iss) {
    if (iss.type === "unstaffed") return;
    flaggedCells[iss.a.sid + "_" + iss.d] = true;
    flaggedCells[iss.b.sid + "_" + iss.d] = true;
  });

  var pills = days.map(function(d) {
    var active = d === selDay, pk = isPeak(d), inM = isInMonth(d);
    return '<button class="gm-day" data-d="' + d + '" style="flex-shrink:0;min-width:50px;text-align:center;padding:8px 4px;border-radius:10px;background:' + (active ? "#00c2ff" : "#04202e") + ';border:1px solid ' + (active ? "#00c2ff" : LN) + ';color:' + (active ? "#04202e" : "#eafbff") + ';opacity:' + (inM ? 1 : 0.5) + ';font-family:var(--font-display);cursor:pointer;">'
      + '<div style="font-size:9px;font-weight:700;opacity:.8;">' + dDay(d) + (pk ? " *" : "") + '</div>'
      + '<div style="font-size:14px;font-weight:800;">' + dNum(d) + '</div>'
    + '</button>';
  }).join("");

  var grpsShow = (ST.grp === 0) ? [1, 2, 3] : [ST.grp];
  var vs = vstaff();
  var sectionsHtml = grpsShow.map(function(gid) {
    var G = GROUPS[gid];
    var gs = vs.filter(function(s) { return s.g === gid; });
    if (!gs.length) return "";
    var cardsHtml = gs.map(function(s) { return gmCard(s, selDay, flaggedCells); }).join("");
    return '<div style="font-size:10px;font-weight:800;color:' + G.color + ';text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px;">' + G.nm + ' (' + gs.length + ')</div>' + cardsHtml;
  }).join("");

  return '<div>'
    + issuesBanner()
    + offBalanceBanner((function() { var t = getTodayIdx(); return (t >= 0 && t < TOTAL_DAYS) ? t : 0; })())
    + '<div style="display:flex;gap:7px;overflow-x:auto;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;">' + pills + '</div>'
    + sectionsHtml
  + '</div>';
}

function bGrid() {
  if (isMobileView()) return bGridMobile();
  var days = wkDays(ST.week);
  var vs = vstaff();
  var curG = GROUPS[ST.grp] || null;
  var thBg = curG ? curG.hdr : "#084258";

  // Flag individual cells involved in a double-booking / self-overlap issue so the
  // problem is visible right where it needs fixing, not just in the summary banner.
  var scheduleIssues = computeScheduleIssues();
  var flaggedCells = {};
  scheduleIssues.forEach(function(iss) {
    if (iss.type === "unstaffed") return;
    flaggedCells[iss.a.sid + "_" + iss.d] = true;
    flaggedCells[iss.b.sid + "_" + iss.d] = true;
  });

  // Column headers
  var colH = "";
  for (var i = 0; i < days.length; i++) {
    var d = days[i], pk = isPeak(d), inM = isInMonth(d), fm = pk && inM;
    colH += '<th style="min-width:105px;background:' + (fm ? thBg : "#084258") + ';opacity:' + (inM ? 1 : 0.6) + ';">'
      + '<div style="font-size:13px;font-weight:800;">' + dNum(d) + '</div>'
      + '<div style="font-size:9px;color:' + (fm ? (curG ? curG.color : "#ffb020") : "#9beaff") + ';margin-top:1px;">' + dDay(d) + (fm ? " *" : "") + '</div>'
      + '<div style="font-size:8px;color:#86a9bb;">' + dMon(d) + (fm ? " PEAK" : "") + '</div>'
      + '</th>';
  }

  function gRow(s, listIds) {
    var sc = ST.sched[s.id] || {};
    var gc = GROUPS[s.g] || {color:"#888", light:"#f1f5f9"};
    var gl = gc.light || "#f1f5f9";
    var cells = "";
    for (var i = 0; i < days.length; i++) {
      var d = days[i];
      var schedSh = getEffectiveShift(s.id, d, ST.sched) || s.sh;
      var cd = getCellData(s.id, d);
      var cellStatus = cd.status;
      var sh = (cellStatus === "OFF" || cellStatus === "ABSENT" || cellStatus === "HALFDAY" || cellStatus === "NODUTY" || cellStatus === "VACATION") ? cellStatus : schedSh;
      var off = (sh === "OFF"), absent = (sh === "ABSENT"), half = (sh === "HALFDAY"), noduty = (sh === "NODUTY"), vacation = (sh === "VACATION");
      var notWorking = off || absent || noduty || vacation;
      var inM = isInMonth(d), pk = isPeak(d) && inM;
      var bg = off ? "#FEF08A" : absent ? "#FEE2E2" : noduty ? "#E2E8F0" : vacation ? "#EDE9FE" : half ? "#DBEAFE" : (SD[sh] ? SD[sh].bg : "#f9fafb");
      if (!inM) bg = "#f8fafc";
      var ctrs = cd.ctrs || [];
      var ctrHtml = "";
      var hasManualCtr = false;
      for (var ci2 = 0; ci2 < ctrs.length; ci2++) {
        if (ctrs[ci2] && ctrs[ci2].ctr && ctrs[ci2].ctr !== "None") {
          hasManualCtr = true;
          ctrHtml += '<div style="font-size:7.5px;color:#1d4ed8;font-weight:700;line-height:1.4;margin-top:1px;font-family:var(--font-mono);">'
            + ctrs[ci2].ctr + " " + ctrs[ci2].from + "-" + ctrs[ci2].to + "</div>";
        }
      }
      if (!hasManualCtr) {
        var autoCtr = getC(s.id, d);
        if (autoCtr && autoCtr !== "None") {
          ctrHtml = '<div style="font-size:7.5px;color:#0e7490;font-weight:700;line-height:1.4;margin-top:1px;font-family:var(--font-mono);">' + autoCtr + '</div>';
        }
      }
      var halfInfo = cd.half || {};
      var effBranch = notWorking ? s.g : getEffectiveBranch(s.id, d);
      var branchChanged = !notWorking && effBranch !== s.g;
      var branchBadge = branchChanged
        ? '<div style="font-size:7px;font-weight:800;color:#1a1a2e;background:' + GROUPS[effBranch].color + ';border-radius:3px;padding:1px 4px;text-align:center;margin-bottom:2px;letter-spacing:.03em;">&rarr; ' + GROUPS[effBranch].nm + ' (' + sh + ')</div>'
        : '';
      var isFlagged = !!flaggedCells[s.id + "_" + d];
      cells += '<td style="opacity:' + (inM ? 1 : 0.5) + '">'
        + '<div class="gc' + (isFlagged ? ' issue-flag' : '') + '" style="background:' + bg + ';position:relative;' + (branchChanged ? 'box-shadow:inset 0 0 0 2px ' + GROUPS[effBranch].color + ';' : '') + '" title="' + (isFlagged ? "Possible double-booking - check counter assignment" : "") + '">'
        + branchBadge
        + (off ? '<div style="font-size:12px;font-weight:900;color:#854d0e;text-align:center;padding:8px 0;">' + (cd.nextMonthOff ? (nextMonthLabelFor(d) + " OFF") : "OFF") + '</div>'
          : absent ? '<div style="font-size:11px;font-weight:900;color:#b91c1c;text-align:center;padding:8px 0;">ABSENT</div>'

// a hand-maintained table - this is what makes it possible to cover Awwal/Zain too,
// since nobody has to hand-author a second/third CTRS_DATA for them) ---
var COVERAGE_WINDOW_START = 8 * 60;  // 08:00 - core hours common to every branch's shifts
var COVERAGE_WINDOW_END = 24 * 60;   // 24:00
function coverageCountersFor(gid) {
  // Center's "must always be staffed" counters are specifically its MAIN ones; Awwal and
  // Zain have no such distinction defined anywhere, so with only 3-5 counters each,
  // treat all of them as counters worth watching.
  if (gid === 1) return getMainCounterIds();
  return (GROUPS[gid] ? GROUPS[gid].ctrs : []).filter(function(c) { return c !== "None"; });
}
// Real per-staff coverage intervals for one branch/day, built the same way the Live tab
// and the Grid tab's conflict detector already derive "who's on which counter, and when".
function liveCoverageBlocks(gid, dayIdx) {
  var staffInBranch = ST.staff.filter(function(s) { return s.g === gid; });
  var blocks = [];
  staffInBranch.forEach(function(s) {
    var sh = getEffectiveShift(s.id, dayIdx, ST.sched) || s.sh;
    var cd = getCellData(s.id, dayIdx);
    var eff = (cd.status === "OFF" || cd.status === "ABSENT" || cd.status === "NODUTY" || cd.status === "VACATION") ? cd.status : sh;
    if (eff === "OFF" || eff === "ABSENT" || eff === "NODUTY" || eff === "VACATION" || !SD[eff]) return;
    var manual = (cd.ctrs && cd.ctrs.length) ? cd.ctrs.filter(function(c) { return c && c.ctr && c.ctr !== "None"; }) : [];
    if (manual.length) {
      manual.forEach(function(e) {
        var s1 = timeToMinutes(e.from), e1 = timeToMinutes(e.to);
        if (e1 <= s1) e1 += 1440;
        blocks.push({ctr: e.ctr, sh: eff, nm: s.nm, start: s1, end: e1});
      });
    } else {

        + '<div style="background:#052536;border:1px solid #0c4a63;border-radius:7px;padding:6px 14px;text-align:center;">'
          + '<div style="font-size:16px;font-weight:900;color:#86a9bb;">' + offList.length + '</div>'

// --- EVENTS ---
// Re-render destroys and recreates the DOM each time, so any render triggered while
// typing in the search box needs to restore both focus and the cursor position.
function focusSearchInputEnd() {
  var el = document.getElementById("ss-input");
  if (el) { el.focus(); var v = el.value; el.value = ""; el.value = v; }
}
// --- UNDO / REDO ---
// Snapshot-based: captures the data that actually matters (roster, schedule, manual
// cell overrides, auto-assignment, and shift definitions) rather than trying to track
// every individual mutation separately. Simple to reason about and safe by
// construction - every "undo point" is a complete, consistent state.
var UNDO_MAX = 50;
function snapshotState() {
  return {
    staff: JSON.parse(JSON.stringify(ST.staff)),
    sched: JSON.parse(JSON.stringify(ST.sched)),
    assign: JSON.parse(JSON.stringify(ST.assign)),
    cells: JSON.parse(JSON.stringify(ST.cells)),
    SD: JSON.parse(JSON.stringify(SD)),
    ctrsData: JSON.parse(JSON.stringify(CTRS_DATA)),
    schedStartMs: SCHED_START.getTime(),
    totalDays: TOTAL_DAYS,
    totalWeeks: TOTAL_WEEKS,
    rangeStart: ST.rangeStart,
    rangeEnd: ST.rangeEnd
  };
}
function restoreSnapshot(snap) {
  ST.staff = snap.staff;
  ST.sched = snap.sched;
  ST.assign = snap.assign;
  ST.cells = snap.cells;
  SD = snap.SD;
  CTRS_DATA = snap.ctrsData;
  SCHED_START = new Date(snap.schedStartMs);
  TOTAL_DAYS = snap.totalDays;
  TOTAL_WEEKS = snap.totalWeeks;
  ST.rangeStart = snap.rangeStart;
  ST.rangeEnd = snap.rangeEnd;
  if (ST.week > TOTAL_WEEKS) ST.week = TOTAL_WEEKS; // stay in bounds if the period got shorter
}
// Call this right BEFORE making a change you want undo-able.
function pushUndo() {
  if (!ST.undoStack) ST.undoStack = [];
  ST.undoStack.push(snapshotState());
  if (ST.undoStack.length > UNDO_MAX) ST.undoStack.shift();
  ST.redoStack = []; // a fresh change invalidates whatever redo history existed
}
function doUndo() {
  if (!ST.undoStack || !ST.undoStack.length) return;
  var current = snapshotState();
  var prev = ST.undoStack.pop();
  if (!ST.redoStack) ST.redoStack = [];
  ST.redoStack.push(current);
  restoreSnapshot(prev);
  ST.editCell = null; // closing any open editor avoids it silently overwriting the restored state on its next Save
  render();
}
function doRedo() {
  if (!ST.redoStack || !ST.redoStack.length) return;
  var current = snapshotState();
  var next = ST.redoStack.pop();
  if (!ST.undoStack) ST.undoStack = [];
  ST.undoStack.push(current);
  restoreSnapshot(next);
  ST.editCell = null;
  render();
}

// Call this from inside the cell editor's mutating handlers - commits the snapshot
// captured when the editor opened, but only the first time (subsequent edits within
// the same session are already covered by that one snapshot).
function commitPendingUndo() {
  if (ST._pendingUndoSnapshot) {
    if (!ST.undoStack) ST.undoStack = [];
    ST.undoStack.push(ST._pendingUndoSnapshot);
    if (ST.undoStack.length > UNDO_MAX) ST.undoStack.shift();
    ST.redoStack = [];
    ST._pendingUndoSnapshot = null;
  }
}
function jumpToStaff(sid) {
  var s = ST.staff.filter(function(x) { return x.id === sid; })[0];
  if (!s) return;
  ST.showSearch = false;
  ST.tab = "grid";
  ST.grp = s.g;
  render();
  setTimeout(function() {
    var nameEl = document.getElementById("nm_" + sid);
    if (!nameEl) return;
    nameEl.scrollIntoView({behavior: "smooth", block: "center"});
    var row = nameEl.closest("tr");
    if (row) {
      row.style.transition = "background-color .4s";
      row.style.backgroundColor = "rgba(0,194,255,.28)";
      setTimeout(function() { row.style.backgroundColor = ""; }, 1700);
    }
  }, 60);
}

  var clClose = q("cl-close"); if (clClose) clClose.onclick = function() { ST.showChangeLog = false; render(); };
  var clClear = q("cl-clear"); if (clClear) clClear.onclick = function() {
    try { localStorage.removeItem(CHANGELOG_KEY); } catch(e) {}
    render();
  };
  var backupNow = q("backup-now-btn"); if (backupNow) backupNow.onclick = function() { exportJSON(); render(); };
  var backupDismiss = q("backup-dismiss-btn"); if (backupDismiss) backupDismiss.onclick = function() { ST.backupBannerDismissed = true; render(); };

  // Title and note inputs
  var ti = q("stitle");   if (ti)   ti.oninput   = function() { ST.titles[ST.grp] = ti.value; };
  var ni = q("note-inp"); if (ni)   ni.oninput   = function() { ST.note = ni.value; };

  // Grid counter dropdowns
  qa(".csel").forEach(function(sel) {
    sel.onchange = function() {
      pushUndo();
      ST.assign[sel.dataset.sid + "_" + sel.dataset.d] = sel.value;
      var lbl = sel.nextElementSibling;
      if (lbl) lbl.textContent = (sel.value && sel.value !== "None") ? sel.value : "-";
    };
    sel.onclick = function(e) { e.stopPropagation(); };
  });

  // Grid inline name edit
  qa(".ei").forEach(function(btn) {
    btn.onclick = function() {
      var id = btn.dataset.id, sp = q("nm_" + id); if (!sp) return;
      var s = ST.staff.filter(function(x) { return x.id === id; })[0]; if (!s) return;
      var inp = document.createElement("input");
      inp.value = s.nm;
      inp.style.cssText = "font-size:11px;font-weight:800;background:#052536;border:1px solid " + gColor(s.g) + ";color:#e2e8f0;padding:2px 6px;border-radius:4px;width:105px;font-family:inherit;outline:none;";
      sp.replaceWith(inp); inp.focus(); inp.select();
      function sv() { var v = inp.value.trim().toUpperCase(); if (v && v !== s.nm) { pushUndo(); s.nm = v; } render(); }
      inp.onblur = sv;
      inp.onkeydown = function(e) { if (e.key === "Enter") inp.blur(); if (e.key === "Escape") render(); };
    };
  });

  // Staff table - name
  qa(".ni").forEach(function(inp) {
    inp.onblur = function() {
      var s = ST.staff.filter(function(x) { return x.id === inp.dataset.id; })[0];
      if (s && inp.value.trim() && inp.value.trim().toUpperCase() !== s.nm) { pushUndo(); s.nm = inp.value.trim().toUpperCase(); }
    };
    inp.onkeydown = function(e) { if (e.key === "Enter") inp.blur(); };
  });

  // Staff table - shift
  qa(".shi").forEach(function(sel) {
    sel.onchange = function() {
      var s = ST.staff.filter(function(x) { return x.id === sel.dataset.id; })[0]; if (!s) return;
      pushUndo();
      s.sh = sel.value;
      var sc = ST.sched[s.id] || {};
      for (var d = 0; d < TOTAL_DAYS; d++) { if (sc[d] !== "OFF") sc[d] = sel.value; }
      ST.sched[s.id] = sc; render();
    };
  });

  // Staff table - group
  qa(".grpi").forEach(function(sel) {
    sel.onchange = function() {
      var s = ST.staff.filter(function(x) { return x.id === sel.dataset.id; })[0];
      if (s) { pushUndo(); s.g = parseInt(sel.value, 10); render(); }
    };
  });

  // Reliever checkbox
  qa(".rvc").forEach(function(cb) {
    cb.onchange = function() {
      var s = ST.staff.filter(function(x) { return x.id === cb.dataset.id; })[0];
      if (s) { pushUndo(); s.rv = cb.checked ? 1 : 0; render(); }
    };
  });

  // Remove staff
  qa(".rmb").forEach(function(btn) {
    btn.onclick = function() {
      var id = btn.dataset.id;
      var s = ST.staff.filter(function(x) { return x.id === id; })[0];
      if (s && confirm("Remove " + s.nm + "? You can undo this with Ctrl+Z if needed.")) {
        pushUndo();
        ST.staff = ST.staff.filter(function(x) { return x.id !== id; });
        delete ST.sched[id]; render();
      }
    };
  });

  // Reorder bars up/down (Grid, Monthly, Coverage, Live, Staff)
  qa(".mv-up").forEach(function(btn) {
    btn.onclick = function() {
      if (btn.disabled) return;
      var listIds = btn.dataset.list ? btn.dataset.list.split(",") : [];
      if (btn.dataset.kind === "ctr") moveCounter(btn.dataset.id, -1, listIds);
      else moveStaff(btn.dataset.id, -1, listIds);
    };
  });
  qa(".mv-dn").forEach(function(btn) {
    btn.onclick = function() {
      if (btn.disabled) return;
      var listIds = btn.dataset.list ? btn.dataset.list.split(",") : [];
      if (btn.dataset.kind === "ctr") moveCounter(btn.dataset.id, 1, listIds);
      else moveStaff(btn.dataset.id, 1, listIds);
    };
  });

  // Add staff
  var ab = q("add-btn"); if (ab) ab.onclick = function() { ST.showAdd = !ST.showAdd; render(); };

  var sn = q("save-new");
  if (sn) sn.onclick = function() {
    var nm = (q("new-nm") || {}).value || "";
    if (!nm.trim()) { alert("Enter a name."); return; }
    pushUndo();
    var gid = parseInt((q("new-grp") || {}).value || "1", 10);
    var sh  = (q("new-sh") || {}).value || "A";
    var rv  = (q("new-rv") || {}).checked ? 1 : 0;
    var pfxMap = {1:"C", 2:"A", 3:"Z"};
    var pfx = pfxMap[gid] || "X";
    var id = nxtId(pfx);
    ST.staff.push({id:id, nm:nm.trim().toUpperCase(), sh:sh, g:gid, rv:rv});
    // Assign 4 offs within the selected period, respecting the same 5-8 day gap rule
    // (and per-branch daily cap) as the main schedule generator.
    var sc = {};
    for (var d = 0; d < TOTAL_DAYS; d++) sc[d] = sh;
    var grpDailyOffs = {};
    for (var d = 0; d < TOTAL_DAYS; d++) {
      grpDailyOffs[d] = ST.staff.filter(function(x) { return x.g === gid && x.id !== id; })
        .filter(function(x) { return (ST.sched[x.id] || {})[d] === "OFF"; }).length;
    }
    function hasCapNew(day) { var maxOff = isPeak(day) ? 2 : 5; return (grpDailyOffs[day] || 0) < maxOff; }
    function rangeArrNew(from, to) {
      var r = [];
      for (var dd = Math.max(0, from); dd <= Math.min(TOTAL_DAYS - 1, to); dd++) r.push(dd);
      return r;
    }
    var GAP_MIN2 = 5, GAP_MAX2 = 8;
    var newOffs = [];
    for (var n2 = 0; n2 < 4; n2++) {
      var attempts2;
      if (newOffs.length === 0) attempts2 = [rangeArrNew(0, GAP_MAX2), rangeArrNew(0, TOTAL_DAYS - 1)];
      else {
        var prev2 = newOffs[newOffs.length - 1];
        attempts2 = [rangeArrNew(prev2 + GAP_MIN2, prev2 + GAP_MAX2), rangeArrNew(prev2 + GAP_MIN2, TOTAL_DAYS - 1)];
      }
      var chosen2 = null;
      for (var ai2 = 0; ai2 < attempts2.length && chosen2 === null; ai2++) {
        var candidates2 = attempts2[ai2].filter(hasCapNew);
        candidates2.sort(function(a, b) { return (isPeak(a) ? 1 : 0) - (isPeak(b) ? 1 : 0); });
        if (candidates2.length) chosen2 = candidates2[Math.floor(Math.random() * Math.min(3, candidates2.length))];
      }
      if (chosen2 === null) break;
      newOffs.push(chosen2);
    }
    newOffs.forEach(function(day) { sc[day] = "OFF"; });
    ST.sched[id] = sc;
    ST.showAdd = false; render();
  };

  var cn = q("cancel-new"); if (cn) cn.onclick = function() { ST.showAdd = false; render(); };

  // Duty Times management
  var smb = q("shift-mgmt-btn"); if (smb) smb.onclick = function() { ST.showShiftMgmt = !ST.showShiftMgmt; ST.shiftMgmtError = null; render(); };

  var addShiftBtn = q("add-shift-btn");
  if (addShiftBtn) addShiftBtn.onclick = function() {
    var codeEl = q("new-sh-code"), fromEl = q("new-sh-from"), toEl = q("new-sh-to");
    var code = ((codeEl && codeEl.value) || "").trim().toUpperCase();
    var from = (fromEl && fromEl.value) || "09:00";
    var to = (toEl && toEl.value) || "17:00";
    if (!code) { ST.shiftMgmtError = "Enter a code for the new duty time."; render(); return; }
    if (!/^[A-Z0-9]{1,3}$/.test(code)) { ST.shiftMgmtError = "Code must be 1-3 letters/numbers."; render(); return; }
    if (SD[code]) { ST.shiftMgmtError = "\"" + code + "\" already exists - pick a different code."; render(); return; }
    if (from === to) { ST.shiftMgmtError = "From and To can't be the same time."; render(); return; }
    pushUndo();
    var fromMin = timeToMinutes(from), toMin = timeToMinutes(to);
    var crossesMidnight = toMin <= fromMin;
    var palette = ["#F59E0B","#ffd166","#2fe6a7","#2DD4BF","#55d0f5","#818CF8","#67e8f9","#F472B6","#FB7185","#FCA5A5","#38bdf8","#facc15"];
    var color = palette[Object.keys(SD).length % palette.length];
    SD[code] = {
      c: color, bg: "#F8FAFC",
      t: from + " - " + to + (crossesMidnight ? " NIGHT" : ""),
      cat: crossesMidnight ? "N" : (fromMin < 720 ? "M" : "AE"),
      note: "Custom shift"
    };
    ST.shiftMgmtError = null;
    render();
    scheduleAutosave();
  };

  qa(".rm-shift-btn").forEach(function(btn) {
    btn.onclick = function() {
      var code = btn.dataset.sh;
      var usedBy = ST.staff.filter(function(s) { return s.sh === code; }).length;
      if (usedBy > 0 || Object.keys(SD).length <= 1) { render(); return; } // safety net - button shouldn't be clickable in this state anyway
      pushUndo();
      delete SD[code];
      render();
      scheduleAutosave();
    };
  });

  // Row hover
  qa(".sr").forEach(function(r) {
    r.onmouseover = function() { r.querySelectorAll("td").forEach(function(td) { td.style.background = "#084258"; }); };
    r.onmouseout  = function() { r.querySelectorAll("td").forEach(function(td) { td.style.background = ""; }); };
  });

  // Cell editor open
  qa(".ce-open").forEach(function(btn) {
    btn.onclick = function(e) {
      e.stopPropagation();
      if (isViewBlocked()) return; // view-only: cells are visible but not editable
      ST._pendingUndoSnapshot = snapshotState(); // captured now, only pushed to history on the first actual edit
      ST.editCell = {sid: btn.dataset.sid, d: parseInt(btn.dataset.d, 10)};
      render();
    };
  });

  // Cell editor events
  if (ST.editCell) {
    var ceClose  = q("ce-close"),  ceCancel = q("ce-cancel"), ceSave = q("ce-save");
    if (ceClose)  ceClose.onclick  = function() { ST.editCell = null; ST._pendingUndoSnapshot = null; render(); };
    if (ceCancel) ceCancel.onclick = function() { ST.editCell = null; ST._pendingUndoSnapshot = null; render(); };

    // Shift change - commits immediately so the counter time pickers re-constrain live
    var ceShift = q("ce-shift");
    if (ceShift) ceShift.onchange = function() {
      var ec = ST.editCell;
      var cd = getCellData(ec.sid, ec.d);
      commitPendingUndo();
      if (!cd.status) {
        var sc3 = ST.sched[ec.sid] || {};
        sc3[ec.d] = ceShift.value;
        ST.sched[ec.sid] = sc3;
      }
      render();
    };

    // Branch change - commits immediately so the counter list re-populates for the
    // newly selected branch right away (e.g. a cross-branch reliever picked up by Zain)
    var ceBranch = q("ce-branch");
    if (ceBranch) ceBranch.onchange = function() {
      var ec = ST.editCell;
      var cd = getCellData(ec.sid, ec.d);
      commitPendingUndo();
      cd.branch = parseInt(ceBranch.value, 10);
      cd.ctrs = []; // old counter picks belonged to the previous branch - clear them
      setCellData(ec.sid, ec.d, cd);
      render();
    };

    // Status toggle
    qa(".ce-status").forEach(function(btn) {
      btn.onclick = function() {
        var ec = ST.editCell;
        var cd = getCellData(ec.sid, ec.d);
        commitPendingUndo();
        cd.status = btn.dataset.st === "DUTY" ? null : btn.dataset.st;
        setCellData(ec.sid, ec.d, cd);
        // Also update sched if OFF/NODUTY/VACATION/ABSENT/HALFDAY
        var sc2 = ST.sched[ec.sid] || {};
        if (btn.dataset.st === "OFF" || btn.dataset.st === "NODUTY" || btn.dataset.st === "VACATION") sc2[ec.d] = btn.dataset.st;
        else if (btn.dataset.st === "ABSENT" || btn.dataset.st === "HALFDAY") {
          var s2 = ST.staff.filter(function(x){return x.id===ec.sid;})[0];
          if (s2) sc2[ec.d] = s2.sh;
        } else {
          var s3 = ST.staff.filter(function(x){return x.id===ec.sid;})[0];
          if (s3) sc2[ec.d] = s3.sh;
        }
        ST.sched[ec.sid] = sc2;
        render();
      };
    });

    // Remove counter row
    qa(".ce-rem-ctr").forEach(function(btn) {
      btn.onclick = function() {
        var ec = ST.editCell;
        var cd = getCellData(ec.sid, ec.d);
        var ci = parseInt(btn.dataset.ci, 10);
        if (cd.ctrs && cd.ctrs[ci]) {
          commitPendingUndo();
          cd.ctrs.splice(ci, 1);
          setCellData(ec.sid, ec.d, cd);
          render();
        }
      };
    });

    // Add counter row
    var ceAddCtr = q("ce-add-ctr");
    if (ceAddCtr) ceAddCtr.onclick = function() {
      var ec = ST.editCell;
      var cd = getCellData(ec.sid, ec.d);
      if (!cd.ctrs) cd.ctrs = [];
      if (cd.ctrs.length < 3) {
        commitPendingUndo();
        var b = shiftTimeBounds(currentShiftFor(ec.sid, ec.d));
        cd.ctrs.push({ctr: "None", from: minutesToHHMM(b.start), to: minutesToHHMM(b.end)});
        setCellData(ec.sid, ec.d, cd);
        render();
      }
    };

    // Multi-counter toggle - switches between the simple Main Counter picker and the
    // detailed per-counter rows, carrying over whatever is currently picked so nothing
    // chosen before the toggle gets lost.
    var ceMultiCtr = q("ce-multi-ctr");
    if (ceMultiCtr) ceMultiCtr.onchange = function() {
      var ec = ST.editCell;
      var cd = getCellData(ec.sid, ec.d);
      commitPendingUndo();
      var b = shiftTimeBounds(currentShiftFor(ec.sid, ec.d));
      if (ceMultiCtr.checked) {
        // Switching to multi-counter: seed row 1 from the current Main Counter pick (if any rows don't already exist)
        var mainSel = q("ce-main-ctr");
        var mainVal = mainSel ? mainSel.value : "None";
        if (!cd.ctrs || !cd.ctrs.length) {
          cd.ctrs = (mainVal && mainVal !== "None") ? [{ctr: mainVal, from: minutesToHHMM(b.start), to: minutesToHHMM(b.end)}] : [];
        }
      } else {
        // Switching back to a single Main Counter: keep only the first row's counter (and its times), drop the rest
        var firstRow = document.querySelector('.ce-ctr-row[data-ci="0"]');
        var firstSel = firstRow ? firstRow.querySelector(".ce-ctr") : null;
        var firstVal = firstSel ? firstSel.value : ((cd.ctrs && cd.ctrs[0]) ? cd.ctrs[0].ctr : "None");
        var existing = (cd.ctrs && cd.ctrs[0]) || {};
        cd.ctrs = (firstVal && firstVal !== "None") ? [{ctr: firstVal, from: existing.from || minutesToHHMM(b.start), to: existing.to || minutesToHHMM(b.end)}] : [];
      }
      cd.multiCtr = ceMultiCtr.checked;
      setCellData(ec.sid, ec.d, cd);
      render();
    };

    // Save cell
    if (ceSave) ceSave.onclick = function() {
      var ec = ST.editCell;
      var cd = getCellData(ec.sid, ec.d);
      commitPendingUndo(); // no-op if an in-editor control already committed this session
      // Read branch override
      var branchSel = q("ce-branch");
      if (branchSel) cd.branch = parseInt(branchSel.value, 10);
      // Read shift override
      var shiftSel = q("ce-shift");
      if (shiftSel) {
        var s4 = ST.staff.filter(function(x){return x.id===ec.sid;})[0];
        if (s4 && !cd.status) {
          ST.sched[ec.sid][ec.d] = shiftSel.value;
        }
      }
      // Read counter selection - either the single Main Counter, or the detailed
      // per-counter rows when "Working more than one counter" is checked
      var ceMultiCtrChk = q("ce-multi-ctr");
      var isMultiCtr = ceMultiCtrChk ? ceMultiCtrChk.checked : (cd.ctrs && cd.ctrs.length > 1);
      var newCtrs = [];
      if (isMultiCtr) {
        var ctrRows = document.querySelectorAll(".ce-ctr-row");
        ctrRows.forEach(function(row) {
          if (row.style.display === "none") return;
          var ci = parseInt(row.dataset.ci, 10);
          var ctrSel = row.querySelector(".ce-ctr");
          var fromSels = document.querySelectorAll(".ce-from");
          var toSels   = document.querySelectorAll(".ce-to");
          var ctrVal   = ctrSel ? ctrSel.value : "None";
          var fromVal  = fromSels[ci] ? fromSels[ci].value : "08:00";
          var toVal    = toSels[ci]   ? toSels[ci].value   : "19:00";
          if (ctrVal && ctrVal !== "None") {
            newCtrs.push({ctr: ctrVal, from: fromVal, to: toVal});
          }
        });
      } else {
        var mainSel = q("ce-main-ctr");
        var mainVal = mainSel ? mainSel.value : "None";
        if (mainVal && mainVal !== "None") {
          var mb = shiftTimeBounds(currentShiftFor(ec.sid, ec.d));
          var existingMain = (cd.ctrs && cd.ctrs[0]) || {};
          newCtrs.push({ctr: mainVal, from: existingMain.from || minutesToHHMM(mb.start), to: existingMain.to || minutesToHHMM(mb.end)});
        }
      }
      cd.ctrs = newCtrs;
      cd.multiCtr = isMultiCtr;
      // Read Half Day worked time + counter (only meaningful when status is HALFDAY,
      // but harmless to store either way - the editor only shows this row for HALFDAY)
      var halfCtrSel = q("ce-half-ctr"), halfFromSel = q("ce-half-from"), halfToSel = q("ce-half-to");
      if (cd.status === "HALFDAY" && halfCtrSel) {
        cd.half = {ctr: halfCtrSel.value, from: halfFromSel ? halfFromSel.value : "", to: halfToSel ? halfToSel.value : ""};
      }
      // Read "count as next month" flag (only meaningful for OFF days - cleared
      // otherwise so it can't linger stale if the status later changes away from OFF)
      if (cd.status === "OFF") {
        var nmoSel = q("ce-next-month-off");
        cd.nextMonthOff = nmoSel ? nmoSel.checked : false;
      } else {
        cd.nextMonthOff = false;
      }
      setCellData(ec.sid, ec.d, cd);
      ST.editCell = null;
      render();
    };
  }

  // View-only mode: the toolbar's mutating buttons are already hidden by bHdr(), but the
  // Staff tab's inline inputs/selects/buttons render regardless of mode - disable them here
  // rather than threading a read-only branch through bStaff()'s HTML generation.
  if (isViewBlocked()) {
    qa(".ni, .shi, .grpi, .rvc, .rmb").forEach(function(el) { el.disabled = true; el.style.opacity = "0.5"; });
    ["add-btn", "shift-mgmt-btn", "save-new"].forEach(function(id) {
      var el = q(id);
      if (el) { el.disabled = true; el.style.opacity = "0.5"; }
    });
  }
}

// --- RENDER ---
function render() {
  var sy = window.scrollY || 0;
  refreshLiveCounters(); // keep counter numbers auto-generated & in sync with the live schedule at all times
  document.getElementById("app").innerHTML = buildApp();
  attachEv();
  syncHeaderOffset(); // #hdr is position:fixed (guaranteed to stay locked while scrolling, regardless of any ancestor/overflow quirk); keep content clear of it since fixed elements are removed from normal flow
  window.scrollTo(0, sy);
  scheduleAutosave(); // auto-save shortly after every edit/render (schedule changes, cell edits, etc.)
}

// Keeps #main-wrap's top padding equal to the fixed header's real rendered
// height, which changes (collapsed/expanded, range panel open, narrow-screen
// wrapping), so content is never hidden under - or gapped away from - the header.
function syncHeaderOffset() {
  var hdr = document.getElementById("hdr"), wrap = document.getElementById("main-wrap");
  if (hdr && wrap) wrap.style.paddingTop = (hdr.offsetHeight + 14) + "px";
}
window.addEventListener("resize", syncHeaderOffset);
// Debounced: re-render on resize only if the mobile/desktop Grid breakpoint was actually
// crossed, so dragging a window a few pixels doesn't force a full rebuild every frame.
var lastMobileState = isMobileView();
var resizeRenderTimer = null;
window.addEventListener("resize", function() {
  clearTimeout(resizeRenderTimer);
  resizeRenderTimer = setTimeout(function() {
    if (!APP_STARTED) return; // don't render over the lock screen
    var nowMobile = isMobileView();
    if (nowMobile !== lastMobileState) {
      lastMobileState = nowMobile;
      if (ST.tab === "grid" && !isUserBusy()) render();
    }
  }, 150);
});

// Ctrl+S shortcut
document.addEventListener("keydown", function(e) {
  if (!APP_STARTED) return; // no shortcuts act on app state before the password gate is passed
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveLocal(); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") { e.preventDefault(); doUndo(); }
  if ((e.ctrlKey || e.metaKey) && ((e.shiftKey && e.key.toLowerCase() === "z") || e.key.toLowerCase() === "y")) { e.preventDefault(); doRedo(); }
  if (e.key === "/" && !ST.showSearch) {
    var tag = (document.activeElement || {}).tagName;
    if (tag !== "INPUT" && tag !== "TEXTAREA" && tag !== "SELECT") {
      e.preventDefault();
      ST.showSearch = true; ST.searchQuery = ""; ST.searchSel = 0;
      render();
      focusSearchInputEnd();
    }
  }
});

// Footer clock
setInterval(function() {
  if (!APP_STARTED) return;
  var f = document.getElementById("footer-ts");
  if (f && lastSaved) f.innerHTML = 'Saved ' + savedAgo() + ' - Ctrl+S';
}, 30000);

// Heartbeat autosave - guarantees work is persisted at least once a minute even with no new edits
setInterval(function() { if (APP_STARTED) silentAutosave(); }, 60000);

// Live Counters tab - refresh every 5s so the dashboard stays real-time while it's open
setInterval(function() { if (APP_STARTED && ST.tab === "live" && !isUserBusy()) render(); }, 5000);

// Start
// One-time correction: earlier saves may still have JANNATH (Awwal) on Shift C
// (10:00-21:00), which Awwal isn't supposed to have. If a restored save brought that
// back, fix it here without disturbing anything else the save contains (cells, other
// staff, counters, etc.) - this runs regardless of whether autoLoad() found saved data
// or fell back to the built-in roster, so it's safe either way.
function migrateAwwalShiftC() {
  var j = ST.staff.filter(function(s) { return s.id === "A02"; })[0];
  if (j && j.sh === "C") {
    j.sh = "B";
    var sc = ST.sched["A02"] || {};
    for (var d = 0; d < TOTAL_DAYS; d++) { if (sc[d] && sc[d] !== "OFF") sc[d] = "B"; }
    ST.sched["A02"] = sc;
  }
}

// Password gate: skip straight to startApp() if this browser tab was already unlocked
// this session; otherwise wire up the static lock screen markup and wait for it.
(function initGate() {
  var unlocked = false;
  try { unlocked = sessionStorage.getItem(PW_SESSION_KEY) === "1"; } catch(e) {}
  if (unlocked) {
    try { VIEW_ONLY = sessionStorage.getItem(PW_VIEWMODE_KEY) === "1"; } catch(e) {}
    startApp();
    return;
  }
  var btn = document.getElementById("lock-btn");
  var inp = document.getElementById("lock-pw");
  if (btn) btn.onclick = doUnlock;
  if (inp) {
    inp.addEventListener("keydown", function(e) { if (e.key === "Enter") doUnlock(); });
    inp.focus();
  }
})();
</script>
</body>
</html>
