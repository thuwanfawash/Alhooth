<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>Cashier Schedule Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#02111a; --void:#01070c; --panel:rgba(4,32,46,.58); --panel-solid:#04202e; --panel-2:#062b3d; --line:rgba(0,180,240,.28); --line-soft:rgba(0,180,240,.14);
  --signal:#00c2ff; --signal-soft:#5fdcff; --signal-dim:#0a4258;
  --cyan:#ffd166; --cyan-dim:#33290a;
  --live:#2fe6a7; --live-dim:#052e22; --amber:#ffb020; --danger:#ff5d7a; --violet:#ff6b9d;
  --text:#eafbff; --text-dim:#86a9bb; --text-faint:#33586b;
  --font-display:'Outfit',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--void);overflow-x:hidden;width:100%;scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:env(safe-area-inset-top, 0px)}
:root{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}

/* ============ AMBIENT LAYER 1: drifting deep-ocean aurora ============ */
@keyframes auroraDrift{
  0%{background-position:0% 0%,100% 100%,50% 0%,0% 100%}
  50%{background-position:100% 50%,0% 50%,20% 80%,100% 0%}
  100%{background-position:0% 0%,100% 100%,50% 0%,0% 100%}
}
body{
  font-family:var(--font-display);background:var(--void);color:var(--text);min-height:100vh;font-size:13px;
  overflow-x:hidden;width:100%;max-width:100vw;
  background-image:
    radial-gradient(ellipse 1100px 700px at 8% -12%,rgba(0,194,255,.26),transparent 60%),
    radial-gradient(ellipse 850px 620px at 106% 8%,rgba(255,209,102,.13),transparent 58%),
    radial-gradient(ellipse 750px 520px at 28% 112%,rgba(255,107,157,.12),transparent 55%),
    radial-gradient(ellipse 900px 600px at 70% 60%,rgba(47,230,167,.07),transparent 60%);
  background-size:180% 180%,180% 180%,180% 180%,200% 200%;
  animation:auroraDrift 24s ease-in-out infinite;
  background-attachment:fixed;
}
/* ============ AMBIENT LAYER 2: bioluminescent particle field ============ */
@keyframes plankton{
  0%{opacity:.4;transform:translateY(0)}
  50%{opacity:1}
  100%{opacity:.4;transform:translateY(-18px)}
}
body::before{
  content:"";position:fixed;inset:-24px 0 0 0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,rgba(255,255,255,.35),transparent 100%),
    radial-gradient(1px 1px at 34% 64%,rgba(95,220,255,.45),transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 12%,rgba(255,209,102,.4),transparent 100%),
    radial-gradient(1px 1px at 72% 48%,rgba(255,255,255,.28),transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 78%,rgba(255,107,157,.35),transparent 100%),
    radial-gradient(1px 1px at 22% 88%,rgba(47,230,167,.35),transparent 100%),
    radial-gradient(1px 1px at 45% 35%,rgba(255,255,255,.22),transparent 100%),
    radial-gradient(1.5px 1.5px at 66% 92%,rgba(95,220,255,.35),transparent 100%),
    radial-gradient(1px 1px at 94% 28%,rgba(255,209,102,.3),transparent 100%),
    radial-gradient(1px 1px at 8% 55%,rgba(47,230,167,.3),transparent 100%);
  animation:plankton 9s ease-in-out infinite alternate;
}
/* ============ AMBIENT LAYER 3: holo grid floor + vignette ============ */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(0,180,240,.05) 1px,transparent 1px) 0 0/100% 44px,
    linear-gradient(90deg,rgba(0,180,240,.05) 1px,transparent 1px) 0 0/44px 100%,
    radial-gradient(ellipse 120% 90% at 50% 40%,transparent 55%,rgba(1,7,12,.6) 100%);
  mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,black 30%,transparent 90%);
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 45%,black 30%,transparent 90%);
}
#app{position:relative;z-index:1}

button,input,select{font-family:inherit}
button{cursor:pointer}
::selection{background:rgba(0,194,255,.45);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#02141d}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--signal),var(--live));border-radius:6px;border:2px solid #02141d}
::-webkit-scrollbar-thumb:hover{background:var(--signal-soft)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:3px}
.np{}

/* ============ signature: flowing energy ticker strip ============ */
@keyframes tickerFlow{0%{background-position:0 0}100%{background-position:240px 0}}
.ticker-strip{height:4px;width:100%;position:relative;background:linear-gradient(90deg,var(--signal) 0%,var(--live) 25%,var(--cyan) 50%,var(--violet) 75%,var(--signal) 100%);background-size:240px 100%;animation:tickerFlow 5s linear infinite;box-shadow:0 0 16px 1px rgba(0,194,255,.65),0 0 30px 4px rgba(255,209,102,.22)}

/* ============ brand logo: holographic 3D float ============ */
@keyframes logoFloat3d{0%,100%{transform:perspective(600px) rotateY(0deg) translateY(0)}50%{transform:perspective(600px) rotateY(6deg) translateY(-4px)}}
@keyframes logoGlow{0%,100%{box-shadow:0 6px 18px -4px rgba(0,0,0,.6),0 0 0px rgba(0,194,255,0)}50%{box-shadow:0 10px 26px -4px rgba(0,0,0,.65),0 0 22px rgba(0,194,255,.6),0 0 40px rgba(255,209,102,.22)}}
.brand-logo{background:#fff;border-radius:10px;padding:4px 8px;animation:logoFloat3d 4s ease-in-out infinite,logoGlow 4s ease-in-out infinite;transform-style:preserve-3d}

/* ============ glass panel base: deep-sea glass with aurora rim ============ */
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--line);box-shadow:0 8px 32px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(160,240,255,.08);transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.glass:hover{box-shadow:0 12px 40px -10px rgba(0,0,0,.65),0 0 24px -8px rgba(0,194,255,.35),inset 0 1px 0 rgba(160,240,255,.1)}
@keyframes issuePulse{0%,100%{box-shadow:0 0 0 2px #ff5d7a, 0 0 0 4px transparent}50%{box-shadow:0 0 0 2px #ff5d7a, 0 0 8px 3px rgba(255,93,122,.5)}}
.issue-flag{animation:issuePulse 1.6s ease-in-out infinite}

/* ============ password gate: wrong-password shake ============ */
@keyframes lockShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lock-shake{animation:lockShake .4s ease}

/* ============ 3D raised buttons with shimmer sweep ============ */
@keyframes shimmerSweep{0%{background-position:-150% 0}100%{background-position:250% 0}}
.nb{background:linear-gradient(160deg,#073042,#031b28);border:1px solid var(--line);color:var(--text-dim);padding:6px 11px;border-radius:8px;font-size:11px;font-weight:600;
  box-shadow:0 3px 0 -1px rgba(0,0,0,.5),0 4px 10px -3px rgba(0,0,0,.6),inset 0 1px 0 rgba(160,240,255,.08);
  transition:border-color .2s var(--ease),color .2s var(--ease),transform .12s var(--ease),box-shadow .12s var(--ease)}
.nb:hover{border-color:var(--signal)!important;color:var(--signal-soft)!important;transform:translateY(-1px);box-shadow:0 4px 0 -1px rgba(0,0,0,.5),0 8px 16px -4px rgba(0,194,255,.35),inset 0 1px 0 rgba(160,240,255,.1)}
.nb:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 0 -1px rgba(0,0,0,.5),0 2px 4px -2px rgba(0,0,0,.6)}

.tb{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:color .2s var(--ease),border-color .25s var(--ease),transform .15s var(--ease);font-family:var(--font-display)}
.tb[data-tab]{position:relative;border-radius:8px 8px 0 0;text-transform:uppercase;letter-spacing:.06em;transition:color .2s var(--ease),border-color .25s var(--ease),transform .18s var(--ease),text-shadow .25s var(--ease),background .2s var(--ease)}
.tb[data-tab]::after{content:"";position:absolute;left:12%;right:12%;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--signal),var(--live));opacity:0;transform:scaleX(.3);transition:opacity .25s var(--ease),transform .3s var(--ease);pointer-events:none}
.tb[data-tab]:hover{transform:translateY(-1px);background:rgba(0,194,255,.08);color:var(--signal-soft)!important;text-shadow:0 0 12px rgba(0,194,255,.8)}
.tb[data-tab]:hover::after{opacity:.8;transform:scaleX(1)}

.sb{background:var(--panel-solid);border:1px solid var(--line);color:var(--text-dim);padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;transition:all .18s var(--ease);box-shadow:0 2px 6px -2px rgba(0,0,0,.5)}
.sb:hover,.sb.act{background:linear-gradient(160deg,var(--signal-dim),#073a50);border-color:var(--signal);color:var(--signal-soft);box-shadow:0 0 0 1px var(--signal) inset,0 4px 12px -4px rgba(0,194,255,.6)}
.sb:not(.act):hover{transform:translateY(-1px)}

.gb{padding:6px 14px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;font-size:11px;font-weight:700;transition:all .18s var(--ease);text-transform:uppercase;letter-spacing:.05em}
.gb:not(:disabled):hover{filter:brightness(1.3);transform:translateY(-1px);text-shadow:0 0 10px currentColor}

#gen,#dl,#print-setup,#save-btn,#sm-btn{position:relative;overflow:hidden;transition:filter .15s var(--ease),transform .12s var(--ease),box-shadow .15s var(--ease);box-shadow:0 3px 0 -1px rgba(0,0,0,.45),0 6px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
#gen::after,#dl::after,#print-setup::after,#save-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.38) 48%,transparent 66%);background-size:250% 100%;background-position:-150% 0;transition:background-position .6s var(--ease);pointer-events:none}
#gen:hover,#dl:hover,#print-setup:hover,#save-btn:hover,#sm-btn:hover{filter:brightness(1.2);transform:translateY(-2px);box-shadow:0 5px 0 -1px rgba(0,0,0,.45),0 10px 22px -4px rgba(0,194,255,.4),inset 0 1px 0 rgba(255,255,255,.18)}
#gen:hover::after,#dl:hover::after,#print-setup:hover::after,#save-btn:hover::after{background-position:250% 0}
#gen:active,#dl:active,#print-setup:active,#save-btn:active{transform:translateY(1px) scale(.98);box-shadow:0 1px 0 -1px rgba(0,0,0,.45),0 2px 6px -2px rgba(0,0,0,.6)}

.sr{transition:background .15s var(--ease)}
.sr:hover td{background:rgba(0,194,255,.1)!important;box-shadow:inset 0 1px 0 rgba(0,194,255,.25),inset 0 -1px 0 rgba(0,194,255,.25)}
.gt{border-collapse:separate;border-spacing:0;width:100%;font-size:11px}
.gt th{color:#fff;padding:7px 5px;text-align:center;border:2px solid #374151;border-left-width:0;white-space:nowrap;font-family:var(--font-display)}
.gt th:first-child{border-left-width:2px}
.gt td{border:1.5px solid #cbd5e1;border-top-width:0;border-left-width:0;padding:0;vertical-align:top;transition:box-shadow .15s var(--ease)}
.gt td:first-child{border-left-width:1.5px}
.gc{padding:5px 6px;min-height:56px;transition:filter .15s var(--ease);border-radius:2px}
.gc:hover{filter:brightness(1.06);box-shadow:inset 0 0 0 2px rgba(0,194,255,.55)}
.gct{font-size:10px;font-weight:700;color:#1e293b;line-height:1.4;font-family:var(--font-mono)}
.csel{font-size:9px;border:1px solid #cbd5e1;border-radius:3px;padding:2px 3px;background:#f8fafc;width:100%;color:#1e3a5f;font-weight:700;margin-top:3px}
.clbl{display:none;font-size:9px;font-weight:700;color:#1e3a5f;margin-top:3px}
.snc{font-weight:800;font-size:11px;color:#1e293b;white-space:nowrap;padding:6px 8px;min-width:150px;vertical-align:middle}
.ei{font-size:10px;cursor:pointer;border:none;background:none;padding:0;margin-right:3px;transition:transform .15s var(--ease)}
.ei:hover{transform:scale(1.15)}
.mvcell{padding:3px 2px;text-align:center;min-width:28px;border:1px solid #e2e8f0;border-width:0 1px 1px 0;font-size:9px;vertical-align:middle;font-family:var(--font-mono)}
.mvcell:nth-child(2){border-left-width:1px}
.stickytop{position:sticky;top:0;z-index:3}
.stickyleft{position:sticky;left:0;z-index:2}
.stickyleft.stickytop{z-index:4}
.gt thead th{position:sticky;top:0;z-index:3}
@media print{
  #hdr,.np{display:none!important}
  body{background:#fff!important;color:#000!important;background-image:none!important;animation:none!important}
  body::before,body::after{display:none!important}
  .pt{display:block!important}
  .gt th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sechdr td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .csel{display:none!important}.clbl{display:block!important}
  .stickytop,.stickyleft{position:static!important}
  @page{size:A4 landscape;margin:6mm}
}
.pt{display:none;font-size:14px;font-weight:900;text-align:center;padding:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ============ live dashboard ============ */
@keyframes livePulse3d{0%{box-shadow:0 0 0 0 rgba(47,230,167,.6),0 0 6px 1px rgba(47,230,167,.8)}70%{box-shadow:0 0 0 10px rgba(47,230,167,0),0 0 6px 1px rgba(47,230,167,.4)}100%{box-shadow:0 0 0 0 rgba(47,230,167,0),0 0 6px 1px rgba(47,230,167,.8)}}
@keyframes liveBlink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes liveSweep{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.live-dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8ffcd6,var(--live));animation:livePulse3d 1.8s infinite;flex-shrink:0}
.live-dot.off{background:#29424e;animation:none;box-shadow:none}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:var(--live-dim);border:1px solid #1a9c6f;color:var(--live);padding:3px 9px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);box-shadow:0 0 14px -3px rgba(47,230,167,.5)}
.live-badge .dotlive{animation:liveBlink 1.2s infinite}
.lv-card{background:linear-gradient(160deg,rgba(6,43,61,.75),rgba(3,27,40,.75));backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:11px;padding:10px 12px;transition:border-color .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);transform-style:preserve-3d;position:relative;overflow:hidden}
.lv-card::before{content:"";position:absolute;top:0;left:-80%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);transform:skewX(-18deg);transition:left .55s var(--ease);pointer-events:none}
.lv-card:hover::before{left:120%}
.lv-card.on{border-color:#1f9c6f;box-shadow:0 0 0 1px rgba(47,230,167,.12),0 4px 18px -6px rgba(47,230,167,.35)}
.lv-card.on:hover{transform:perspective(500px) rotateX(2deg) translateY(-3px);box-shadow:0 12px 26px -8px rgba(47,230,167,.45),0 0 0 1px rgba(47,230,167,.2)}
.lv-card:not(.on):hover{transform:translateY(-2px);border-color:var(--signal)}

/* ============ header: aurora crown + holographic title ============ */
@keyframes titleShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
#hdr h1{background-size:200% auto!important;animation:titleShimmer 6s linear infinite}
#hdr{border-bottom:1px solid rgba(0,180,240,.4)!important}
#hdr [data-day]{transition:transform .18s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)!important}
#hdr [data-day]:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 20px -6px rgba(0,194,255,.55),0 0 0 1px rgba(0,194,255,.45);border-color:var(--signal)!important}

/* ============ controls: glow focus, dark-native pickers ============ */
select,input{transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
select:focus,input:focus{border-color:var(--signal)!important;box-shadow:0 0 0 3px rgba(0,194,255,.22),0 0 14px -2px rgba(0,194,255,.5);outline:none}
input[type="date"]{color-scheme:dark}
input[type="checkbox"]{accent-color:var(--signal)}
select:hover,input:hover{border-color:var(--signal-soft)!important}

button{transition:filter .15s var(--ease),transform .13s var(--ease),box-shadow .15s var(--ease),border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
button:not(:disabled):hover{filter:brightness(1.15)}
button:not(:disabled):active{transform:scale(.965)}

#sm button:hover{background:rgba(0,194,255,.14)!important;padding-left:20px!important}
#sm{animation:menuIn .18s var(--ease)}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

#app div[style*="z-index:300"]{backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);animation:overlayIn .2s var(--ease)}
#app div[style*="z-index:300"]>div{animation:modalIn .28s var(--ease)}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.mv-up:not(:disabled):hover,.mv-dn:not(:disabled):hover{transform:scale(1.35);filter:drop-shadow(0 0 4px rgba(0,194,255,.9))}

@media (prefers-reduced-motion:reduce){
  body{animation:none!important}
  body::before{animation:none!important}
  .ticker-strip,.live-dot,.live-badge .dotlive,.lv-card,.brand-logo,#gen::after,#dl::after,#print-setup::after,#save-btn::after,#hdr h1,#sm,.issue-flag{animation:none!important;transition:none!important}
  button,select,input,.tb[data-tab],#hdr [data-day],.lv-card::before{transition:none!important;animation:none!important}
}

</style>
</head>
<body>
<div id="app"><div id="lock-screen" style="position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(1,7,12,.62);backdrop-filter:blur(8px) saturate(150%);-webkit-backdrop-filter:blur(8px) saturate(150%);font-family:'Outfit',system-ui,sans-serif;">
  <div class="glass" id="lock-card" style="width:340px;max-width:100%;border-radius:14px;padding:32px 28px 28px;text-align:center;">
    <div style="font-size:10px;color:#00c2ff;text-transform:uppercase;letter-spacing:.14em;margin-bottom:8px;">Restricted Access</div>
    <div style="font-size:17px;font-weight:800;color:#eafbff;margin-bottom:2px;">Cashier Schedule Manager</div>
    <div style="font-size:10px;color:#86a9bb;margin-bottom:22px;">Center &middot; Awwal &middot; Zain</div>
    <input id="lock-pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%;box-sizing:border-box;background:#04202e;border:1px solid rgba(0,180,240,.28);color:#eafbff;padding:11px 14px;border-radius:8px;font-size:13px;font-family:'JetBrains Mono',ui-monospace,monospace;text-align:center;letter-spacing:.06em;outline:none;margin-bottom:6px;"/>
    <div id="lock-err" style="min-height:15px;font-size:10.5px;color:#ff5d7a;margin:6px 0 14px;"></div>
    <button id="lock-btn" style="width:100%;background:linear-gradient(160deg,#147a9e,#0a4258);border:1px solid #00c2ff;color:#ccf3ff;padding:11px;border-radius:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;">Unlock</button>
  </div>
</div></div>
<script>
// --- CONSTANTS - ASCII ONLY in JS code ---
var TY = 2026, TM = 6; // July 2026 (month index 6)
var MNAMES = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

var PW_KEY = "sched_3g_v4_pwhash";

var APP_STARTED = false;
function pwHash(s) {

  for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; }

  } catch(e) { return pwHash(DEFAULT_PW); }
}
function setPWHash(newPw) {
  try { localStorage.setItem(PW_KEY, pwHash(newPw)); } catch(e) {}

// SCHEDULE GENERATION | 4 offs per staff within the selected period | Each staff member's
// off-days are spaced 5-8 days apart (never back-to-back) | Prefer non-peak days (Tue/Wed/Thu)
// The daily off-cap (2 on peak days, 5 on non-peak) applies per branch, not company-wide -
// otherwise all 3 branches would compete for the same tiny shared quota and most staff
// would fall short of their 4 offs regardless of spacing.
function generateSchedule() {
  var dailyOffs = {}; // key: day + "_" + branchGroup
  function keyFor(day, grp) { return day + "_" + grp; }
  for (var d = 0; d < TOTAL_DAYS; d++) { for (var g = 1; g <= 3; g++) dailyOffs[keyFor(d, g)] = 0; }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {

      var t = a[i]; a[i] = a[j]; a[j] = t;

    return a;

    var maxOff = isPeak(day) ? 2 : 5;
    return dailyOffs[keyFor(day, grp)] < maxOff;
  }

  // Company-wide night-shift pool cap: across ALL THREE branches combined, at most
  // ONE of these 7 people (Thuwan/Manu/Shathul + Sujit/Dezousa + Saugat/Abin) can be
  // off on any single day - every day, peak or not, no exception. This is what makes
  // "Adharsh covers every night-shift off" actually achievable: he's one person, so
  // if two of them were ever off on the same day he could only cover one. Capping
  // this at generation time means that situation can no longer occur in the first
  // place, instead of just being handled as best-effort afterward.
  var NIGHT_POOL_IDS = ["C17", "C18", "C19", "A04", "A05", "Z08", "Z09"];
  var isNightPoolMember = {};
  NIGHT_POOL_IDS.forEach(function(id) { isNightPoolMember[id] = true; });
  var nightPoolOffs = {};
  for (var d0 = 0; d0 < TOTAL_DAYS; d0++) nightPoolOffs[d0] = 0;
  function hasNightPoolCap(day) { return nightPoolOffs[day] < 1; }
  // Shuffle, then rank: if a conflictScorer is given (all-branch relievers only),
  // fewest-conflicts-first is the primary key; peak/non-peak is always the tie-breaker.

  // different (but same-half) shift than the person they're covering for. The reliever's
  // off-days must never land on a day the fixed staff is off, or CS would go uncovered.
  var relieverToFixed = {};

    var rel = ST.staff.filter(function(r) {

  var isFixedWithReliever = {};

  var isAllBranchReliever = {};
  ALL_BRANCH_RELIEVER_IDS.forEach(function(id) { isAllBranchReliever[id] = true; });

  var fixedFirst = ST.staff.filter(function(s) { return isFixedWithReliever[s.id]; });
  var middleTier = ST.staff.filter(function(s) { return !isFixedWithReliever[s.id] && !isAllBranchReliever[s.id]; });
  var relieverTier = ST.staff.filter(function(s) { return isAllBranchReliever[s.id]; });
  var processingOrder = shuffle(fixedFirst.slice()).concat(shuffle(middleTier.slice())).concat(relieverTier);

  processingOrder.forEach(function(s) {
    o[s.id] = {};
    for (var d = 0; d < TOTAL_DAYS; d++) o[s.id][d] = s.sh;

      if (isNightPoolMember[s.id] && !hasNightPoolCap(d)) return false;
      return hasCap(d, grp);
    };

    // must avoid whatever days that partner is already off.
    var excludeDays = relieverToFixed[s.id] ? (committedOffs[relieverToFixed[s.id]] || []) : [];

    var coverageSet = relieverCoverageSets[s.id];

      // on peak days, are the most exposed group on peak days now - avoid
      // giving them a peak-day off whenever any non-peak day is available at

          // even if that stretches past 8 - never closer than 5, but better than a 4th off

// Automatic cross-branch reliever coverage. Cheysar (AM), Feba (PM/Evening), and
// Adharsh (Night) cover gaps in ANY branch. A reliever's WORKING TIME is not fixed to
// their own appointed shift - they adopt the specific shift of whoever they're
// covering for (an 8am-7pm gap gets covered 8am-7pm, a 10am-9pm gap gets covered
// 10am-9pm, etc). If nobody needs covering, a reliever just works their own
// appointed shift as normal.
//
// Zain morning (Dani=8am-7pm/A, Annie=split/B, Amana=10am-9pm/C) needs all three
// covered every day. Akshay (Zain's own AM reliever) is first responder for any
// single gap, adopting that person's shift. If more than one is off at once,
// Cheysar (all-branch AM reliever) covers the second gap, also adopting that
// person's specific shift.
//
// Center night (Thuwan/Manu/Shathul) has exactly enough staff and no slack - any
// single one of them being off is a genuine gap. Awwal night (Sujit/Dezousa) and
// Zain night (Saugat/Abin) are in the same position. Adharsh covers EVERY off among
// ANY of these seven people, every day, adopting the shift of whoever he's covering.
// Priority is Awwal, then Zain, then Center - Center is his fallback since he
// already works there by default (his home branch) whenever nobody else needs him.
//
// Every other branch/bucket (Center AM/PM, Awwal AM/PM) has no local reliever at
// all, so this acts as a safety net: if EVERY native staff member in that bucket is
// off on the same day, the matching all-branch reliever steps in.
function computeAutoRelief(sched) {

  var AM_RELIEVER = "C08", PM_RELIEVER = "C16", NIGHT_RELIEVER = "C20";

  function isOff(id, d) { return sched[id] && sched[id][d] === "OFF"; }
  function shiftOf(id, d) {
    var s = ST.staff.filter(function(x) { return x.id === id; })[0];
    var sc = (sched[id] || {})[d];
    return (sc && sc !== "OFF") ? sc : (s ? s.sh : null);
  }
  function deploy(relieverId, gid, d, shiftCode) {
    if (isOff(relieverId, d)) return false;             // reliever unavailable that day
    if (relief[relieverId + "_" + d]) return false;      // already deployed elsewhere today
    relief[relieverId + "_" + d] = {branch: gid, shift: shiftCode};
    return true;
  }

  var zainAM = ["Z01", "Z02", "Z03"]; // Dani(A), Annie(B), Amana(C)
  var zainAMReliever = "Z04"; // Akshay
  var zainPM = ["Z05", "Z06", "Z07"]; // Teesa(E), Durga(E), Bishnu(F) - no dedicated reliever of their own
  var centerNight = ["C17", "C18", "C19"]; // Thuwan(H), Manu(H), Shathul(I)
  var awwalNight = ["A04", "A05"]; // Sujit(I), Dezousa(I) - no dedicated reliever of their own
  var zainNight = ["Z08", "Z09"];  // Saugat(I), Abin(I) - no dedicated reliever of their own

  var otherBuckets = {
    "1_AM":  {ids: ["C01","C02","C03","C04","C05","C06","C07"], reliever: AM_RELIEVER,    gid: 1},
    "1_PM":  {ids: ["C09","C10","C11","C12","C13","C14","C15"], reliever: PM_RELIEVER,    gid: 1}
    // Center AM/PM only get this generic total-wipeout safety net on peak
    // days now (checked further below) - on non-peak days these 7-person
    // teams have enough slack that even a partial gap doesn't need Cheysar/
    // Feba pulled off other duty. Awwal AM/PM and Zain PM are handled by
    // dedicated priority logic below instead of this safety net - they have
    // no redundancy of their own, so they need earlier, more aggressive,
    // every-day coverage than "wait until everyone's off."

  for (var d = 0; d < TOTAL_DAYS; d++) {

    // Awwal morning: only two people (A01/A02) and no dedicated reliever of
    // their own, so a single off is a real gap - covered immediately, any day.
    var offAwwalAM = ["A01", "A02"].filter(function(id) { return isOff(id, d); });
    if (offAwwalAM.length >= 1) deploy(AM_RELIEVER, 2, d, shiftOf(offAwwalAM[0], d));

    // Zain morning: on non-peak days, Akshay covers the first gap and Cheysar
    // backs up a second simultaneous gap, same as always. On PEAK days, Zain
    // needs Shift B double-covered (below) - Akshay is reserved for that, so
    // Cheysar becomes the direct, immediate responder for any Zain AM gap.
    var offZainAM = zainAM.filter(function(id) { return isOff(id, d); });
    if (peakDay) {
      if (offZainAM.length >= 1) deploy(AM_RELIEVER, 3, d, shiftOf(offZainAM[0], d));
    } else {
      if (offZainAM.length >= 1) deploy(zainAMReliever, 3, d, shiftOf(offZainAM[0], d));
      if (offZainAM.length >= 2) deploy(AM_RELIEVER, 3, d, shiftOf(offZainAM[1], d));
    }

    // Zain peak-day Shift B reinforcement: Annie (Z02/B) alone isn't enough
    // staffing for Shift B on peak days, so Akshay works Shift B alongside her
    // instead of his usual roving AM duty - unless he's off himself, in which
    // case there's nobody else to send.
    if (peakDay && !isOff(zainAMReliever, d)) {
      deploy(zainAMReliever, 3, d, "B");
    }

    // PM reliever (Feba) priority for immediate single-gap coverage, mirroring
    // Adharsh's night-reliever priority order below (Awwal first, then Zain):
    // Awwal PM (Sangeetha) is one person with zero redundancy, so any single
    // off there is a total gap; Zain PM (Teesa/Durga/Bishnu) has no dedicated
    // reliever of its own either, so a single off there is a real gap too -
    // previously neither had any coverage path for a single day off.
    var offAwwalPM = ["A03"].filter(function(id) { return isOff(id, d); });
    if (offAwwalPM.length >= 1) deploy(PM_RELIEVER, 2, d, shiftOf(offAwwalPM[0], d));

    var offZainPM = zainPM.filter(function(id) { return isOff(id, d); });
    if (offZainPM.length >= 1) deploy(PM_RELIEVER, 3, d, shiftOf(offZainPM[0], d));

    // Night reliever (Adharsh) covers EVERY off among ANY night-shift staff, across
    // ALL THREE branches, every single day - no threshold, no peak/non-peak gating.
    // Priority: Awwal first, then Zain, then Center - neither Awwal nor Zain has a
    // dedicated night reliever of their own, so any single off there is a genuine
    // hole. Center is checked last because Adharsh already sits there by default
    // (his home branch) on any day nobody else needs him - this is reinforcement on
    // top of that, not his primary job. If two people are off in the same branch on
    // the same day, Adharsh (being one person) can only cover the first.
    var offAwwalNight = awwalNight.filter(function(id) { return isOff(id, d); });
    if (offAwwalNight.length >= 1) deploy(NIGHT_RELIEVER, 2, d, shiftOf(offAwwalNight[0], d));

    var offZainNight = zainNight.filter(function(id) { return isOff(id, d); });
    if (offZainNight.length >= 1) deploy(NIGHT_RELIEVER, 3, d, shiftOf(offZainNight[0], d));

    var offCenterNight = centerNight.filter(function(id) { return isOff(id, d); });
    if (offCenterNight.length >= 1) deploy(NIGHT_RELIEVER, 1, d, shiftOf(offCenterNight[0], d));

    // General safety net: total gap in Center AM/PM, peak days only (see note
    // on otherBuckets above).
    if (peakDay) {

      + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">' + fromSel + '<span style="color:#4f8ba1;font-size:10px;">to</span>' + toSel + '</div>'
      + '<div id="be-count" style="font-size:10.5px;color:' + (dayCount > 0 ? "#4f8ba1" : "#ff5d7a") + ';margin-bottom:18px;">' + (dayCount > 0 ? ("Will set " + dayCount + " day" + (dayCount === 1 ? "" : "s") + " to " + status) : "End date must be on or after start date") + '</div>'
      + '<div style="display:flex;justify-content:flex-end;gap:10px;">'
        + '<button id="be-cancel" style="background:transparent;border:1px solid ' + LN + ';color:#86a9bb;padding:8px 16px;border-radius:6px;font-size:11px;cursor:pointer;">Cancel</button>'
        + '<button id="be-apply" style="background:#1a3a6e;border:1px solid #00c2ff;color:#9beaff;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;" ' + (dayCount <= 0 ? "disabled" : "") + '>Apply</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

      + '<div style="font-size:10px;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;">Security</div>'
      + '<div style="font-size:15px;font-weight:800;color:#eafbff;margin-bottom:14px;">Change Password</div>'
      + '<div style="display:flex;gap:6px;margin-bottom:14px;">'
        + '<button id="cp-mode-admin" style="flex:1;padding:7px 4px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;background:' + (adminOn ? "#0f6b45" : "transparent") + ';border:1px solid ' + (adminOn ? "#1a9c6f" : LN) + ';color:' + (adminOn ? "#9df5d0" : "#86a9bb") + ';">Admin Password</button>'
        + '<button id="cp-mode-view" style="flex:1;padding:7px 4px;border-radius:6px;font-size:10.5px;font-weight:700;cursor:pointer;background:' + (!adminOn ? "#0f6b45" : "transparent") + ';border:1px solid ' + (!adminOn ? "#1a9c6f" : LN) + ';color:' + (!adminOn ? "#9df5d0" : "#86a9bb") + ';">View-Only Password</button>'
      + '</div>'
      + '<input type="password" id="cp-security" placeholder="Security password (required)" autocomplete="off" value="' + (ST.cpSecurity || "").replace(/"/g, "&quot;") + '" style="width:100%;box-sizing:border-box;background:#04202e;border:1px solid #ffb02066;color:#eafbff;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:10px;font-family:var(--font-mono);outline:none;"/>'
      + '<div style="height:1px;background:' + LN + ';margin:0 0 12px;"></div>'
      + (adminOn ? '<input type="password" id="cp-cur" placeholder="Current password" autocomplete="current-password" value="' + (ST.cpCur || "").replace(/"/g, "&quot;") + '" style="width:100%;box-sizing:border-box;background:#04202e;border:1px solid ' + LN + ';color:#eafbff;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:8px;font-family:var(--font-mono);outline:none;"/>' : '')
      + '<input type="password" id="cp-new" placeholder="New password (min 4 characters)" autocomplete="new-password" value="' + (ST.cpNew || "").replace(/"/g, "&quot;") + '" style="width:100%;box-sizing:border-box;background:#04202e;border:1px solid ' + LN + ';color:#eafbff;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:8px;font-family:var(--font-mono);outline:none;"/>'
      + '<input type="password" id="cp-conf" placeholder="Confirm new password" autocomplete="new-password" value="' + (ST.cpConf || "").replace(/"/g, "&quot;") + '" style="width:100%;box-sizing:border-box;background:#04202e;border:1px solid ' + LN + ';color:#eafbff;padding:9px 12px;border-radius:6px;font-size:12px;margin-bottom:6px;font-family:var(--font-mono);outline:none;"/>'
      + (adminOn ? '' : '<div style="font-size:9.5px;color:#86a9bb;margin:-2px 0 10px;line-height:1.4;">Anyone with this password can view every tab but can\'t edit the schedule, run Generate, or reach this menu.</div>')
      + '<div id="cp-err" style="min-height:14px;font-size:10px;color:var(--danger);margin-bottom:10px;"></div>'
      + '<div style="display:flex;justify-content:flex-end;gap:10px;">'
        + '<button id="cp-cancel" style="background:transparent;border:1px solid ' + LN + ';color:#86a9bb;padding:8px 16px;border-radius:6px;font-size:11px;cursor:pointer;">Cancel</button>'
        + '<button id="cp-save" style="background:#0f6b45;border:1px solid #1a9c6f;color:#9df5d0;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">Save</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

function bStaffSearch() {
  var qv = (ST.searchQuery || "").toLowerCase();
  var matches = ST.staff.filter(function(s) { return !qv || s.nm.toLowerCase().indexOf(qv) !== -1; }).slice(0, 8);
  var sel = Math.max(0, Math.min(ST.searchSel || 0, matches.length - 1));
  var rows = matches.map(function(s, i) {
    var g = GROUPS[s.g];
    var initials = s.nm.slice(0, 2);
    var active = i === sel;
    return '<div class="ss-row" data-sid="' + s.id + '" data-i="' + i + '" style="display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;' + (active ? 'background:rgba(0,194,255,.12);box-shadow:inset 0 0 0 1px #00c2ff66;' : '') + '">'
      + '<div style="width:30px;height:30px;border-radius:50%;background:' + g.color + '22;border:1px solid ' + g.color + '77;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:' + g.color + ';flex-shrink:0;">' + initials + '</div>'
      + '<div style="flex:1;min-width:0;">'
        + '<div style="font-size:12px;font-weight:700;color:#eafbff;">' + s.nm + (s.rv ? ' <span style="color:#2fe6a7;font-size:9px;">R</span>' : '') + '</div>'
        + '<div style="font-size:9.5px;color:#86a9bb;">' + g.nm + ' &middot; Shift ' + s.sh + (s.cs ? ' &middot; CS' : '') + '</div>'
      + '</div>'
      + '<span style="font-size:9px;color:#86a9bb;">Jump to schedule &rarr;</span>'
    + '</div>';
  }).join("");
  return '<div id="ss-backdrop" role="dialog" aria-modal="true" aria-label="Search staff" style="position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:300;display:flex;align-items:flex-start;justify-content:center;padding:16px;padding-top:100px;">'
    + '<div id="ss-panel" style="width:560px;max-width:100%;background:var(--panel-solid);border:1px solid #00c2ff55;border-radius:12px;box-shadow:0 24px 60px -12px rgba(0,0,0,.7);overflow:hidden;">'
      + '<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid ' + LN + ';">'
        + '<span style="font-size:15px;color:#00c2ff;">&#128269;</span>'
        + '<input id="ss-input" type="text" placeholder="Search staff by name..." aria-label="Search staff by name" value="' + (ST.searchQuery || "").replace(/"/g, "&quot;") + '" style="flex:1;background:none;border:none;outline:none;font-size:14px;color:#eafbff;font-weight:600;font-family:var(--font-display);" autocomplete="off" spellcheck="false"/>'
        + '<span style="font-size:9px;color:#86a9bb;border:1px solid ' + LN + ';border-radius:4px;padding:2px 6px;">ESC</span>'
      + '</div>'
      + '<div style="max-height:360px;overflow:auto;padding:6px;" id="ss-list">' + (rows || '<div style="padding:20px;text-align:center;font-size:11px;color:#86a9bb;">No staff match &quot;' + (ST.searchQuery || "") + '&quot;</div>') + '</div>'
      + '<div style="padding:8px 16px;border-top:1px solid ' + LN + ';display:flex;gap:14px;font-size:9px;color:#86a9bb;">'
        + '<span>&#8593;&#8595; navigate</span><span>&#9166; open</span><span>' + matches.length + ' of ' + ST.staff.length + ' staff</span>'
      + '</div>'
    + '</div>'
  + '</div>';
}

function bCellEditor() {
  var ec = ST.editCell;
  if (!ec) return "";
  var s = ST.staff.filter(function(x) { return x.id === ec.sid; })[0];
  if (!s) return "";
  var sc = ST.sched[s.id] || {};
  var schedSh = getEffectiveShift(s.id, ec.d, ST.sched) || s.sh;
  var cd = getCellData(ec.sid, ec.d);
  var status = cd.status || (schedSh === "OFF" ? "OFF" : "DUTY");
  var ctrs = cd.ctrs && cd.ctrs.length ? cd.ctrs : [];
  var cellBranch = getEffectiveBranch(s.id, ec.d); // which branch this staff member is effectively working in for this cell (manual override, auto-relief deployment, or their home branch)

  var STATUS_LABELS = {DUTY: "DUTY", OFF: "OFF", ABSENT: "ABSENT", HALFDAY: "HALF DAY", NODUTY: "NO DUTY", VACATION: "VACATION"};
  var STATUS_COLORS = {DUTY: "#4ade80", OFF: "#ffb020", ABSENT: "#ff5d7a", HALFDAY: "#38bdf8", NODUTY: "#94a3b8", VACATION: "#c084fc"};
  // Status buttons
  var statBtns = ["DUTY","OFF","ABSENT","HALFDAY","NODUTY","VACATION"].map(function(st2) {
    var act = (status === st2);
    var col = STATUS_COLORS[st2];
    return '<button class="ce-status" data-st="' + st2 + '" style="flex:1 1 30%;min-width:78px;padding:8px 4px;border:2px solid '
      + (act ? col : "#0c4a63") + ";background:" + (act ? col + "22" : "#031b28")
      + ";color:" + (act ? col : "#86a9bb")
      + ';border-radius:6px;font-size:10.5px;font-weight:' + (act ? 700 : 500) + ';cursor:pointer;">' + STATUS_LABELS[st2] + "</button>";
  }).join("");

  // Shift override dropdown
  var shOpts = Object.keys(SD).map(function(k) {
    return '<option value="' + k + '"' + (k === schedSh ? " selected" : "") + ">" + k + " - " + SD[k].t + "</option>";
  }).join("");
  var shiftSel = '<select id="ce-shift" style="background:#031b28;border:1px solid #0c4a63;color:#55d0f5;padding:6px 9px;border-radius:5px;font-size:11px;font-weight:600;outline:none;width:100%;">' + shOpts + "</select>";

  // Branch selector - lets a staff member (typically a cross-branch reliever) be
  // assigned to work a different branch than their home one for this specific day.
  // Counter options below follow whichever branch is picked here.
  var branchOpts = [1, 2, 3].map(function(g) {
    return '<option value="' + g + '"' + (g === cellBranch ? " selected" : "") + ">" + GROUPS[g].nm + (g === s.g ? " (Home)" : "") + "</option>";
  }).join("");
  var branchSel = '<select id="ce-branch" style="background:#031b28;border:1px solid #0c4a63;color:#7dd3fc;padding:6px 9px;border-radius:5px;font-size:11px;font-weight:600;outline:none;width:100%;">' + branchOpts + "</select>";

  // Counter rows (up to 3) - from/to times are constrained to this shift's already-applied hours
  var ctrOps = ctrOpts(cellBranch);
  var timeBounds = shiftTimeBounds(schedSh);
  var timeOptsForShift = constrainedTimeOpts(schedSh);
  var defFrom = minutesToHHMM(timeBounds.start), defTo = minutesToHHMM(timeBounds.end);
  var ctrRows = "";
  for (var ci = 0; ci < 3; ci++) {
    var cdata = ctrs[ci] || {ctr: "None", from: defFrom, to: defTo};
    var cOpts = ctrOps.map(function(c) {
      return '<option value="' + c + '"' + (cdata.ctr === c ? " selected" : "") + ">" + c + "</option>";
    }).join("");
    ctrRows += '<div class="ce-ctr-row" data-ci="' + ci + '" style="display:' + (ci < Math.max(1, ctrs.length) ? "flex" : "none")
      + ';align-items:center;gap:6px;margin-bottom:8px;">'
      + '<span style="font-size:10px;color:#86a9bb;min-width:14px;">' + (ci + 1) + '.</span>'
      + '<select class="ce-ctr" data-ci="' + ci + '" style="background:#031b28;border:1px solid #0c4a63;color:#ffd166;padding:5px 6px;border-radius:5px;font-size:11px;font-weight:600;outline:none;flex:1;">' + cOpts + "</select>"
      + timeSelect("ce-from-" + ci, cdata.from, "ce-from", timeOptsForShift)
      + '<span style="font-size:10px;color:#86a9bb;">to</span>'
      + timeSelect("ce-to-" + ci, cdata.to, "ce-to", timeOptsForShift)
      + (ci > 0 ? '<button class="ce-rem-ctr" data-ci="' + ci + '" style="background:#1a0a0a;border:1px solid #7f1d1d;color:#ff5d7a;padding:4px 8px;border-radius:4px;font-size:10px;cursor:pointer;">x</button>' : "")
      + "</div>";
  }
  var timeHint = '<div style="font-size:8.5px;color:#4f8ba1;margin-bottom:8px;">Times limited to this shift\'s hours: ' + defFrom + ' - ' + defTo + '. Change Duty Shift above to widen the range.</div>';

  var addCtrBtn = ctrs.length < 3
    ? '<button id="ce-add-ctr" style="background:#031b28;border:1px dashed #147a9e;color:#00c2ff;padding:6px 12px;border-radius:5px;font-size:10px;cursor:pointer;width:100%;margin-bottom:8px;">+ Add Counter</button>'
    : "";

  // Main Counter: a plain counter picker with no time fields, for the common case of one
  // counter for the whole shift. "Working more than one counter" switches to the fuller
  // Counter Assignments rows above (separate counter + time per row). Defaults to whatever
  // was saved before this existed - two or more saved rows implies multi-counter was in use.
  var multiCtr = (cd.multiCtr !== undefined) ? !!cd.multiCtr : (ctrs.length > 1);
  var mainCtrVal = (ctrs[0] && ctrs[0].ctr) ? ctrs[0].ctr : "None";
  var mainCtrOpts = ctrOps.map(function(c) {
    return '<option value="' + c + '"' + (mainCtrVal === c ? " selected" : "") + ">" + c + "</option>";
  }).join("");
  var mainCtrSel = '<select id="ce-main-ctr" style="background:#031b28;border:1px solid #0c4a63;color:#ffd166;padding:6px 9px;border-radius:5px;font-size:11px;font-weight:600;outline:none;width:100%;">' + mainCtrOpts + "</select>";
  var multiCtrCheckbox = '<label style="display:flex;align-items:center;gap:7px;font-size:10.5px;color:#9beaff;font-weight:600;cursor:pointer;margin-bottom:10px;">'
    + '<input type="checkbox" id="ce-multi-ctr"' + (multiCtr ? " checked" : "") + ' style="width:14px;height:14px;accent-color:#00c2ff;cursor:pointer;"/>'
    + 'Working more than one counter'
    + '</label>';

  var isDuty = (status === "DUTY");
  var isHalf = (status === "HALFDAY");
  var isOff = (status === "OFF");

  // "Count toward next month" - for when this month's 4 offs are already used up and
  // someone needs one more before the period ends. Marking it here just relabels this
  // OFF day and excludes it from THIS month's off count (see moff()) - it doesn't touch
  // next month's own schedule, which doesn't exist yet in this generated period.
  var nextMonthLabel = nextMonthLabelFor(ec.d);
  var isNextMonthOff = !!cd.nextMonthOff;
  var offsUsed = moff(s.id);
  var nextMonthCheckbox = '<label style="display:flex;align-items:center;gap:7px;font-size:10.5px;color:#9beaff;font-weight:600;cursor:pointer;">'
      + '<input type="checkbox" id="ce-next-month-off"' + (isNextMonthOff ? " checked" : "") + ' style="width:14px;height:14px;accent-color:#ffb020;cursor:pointer;"/>'
      + 'Count as ' + nextMonthLabel + ' off (taken early)'
    + '</label>'
    + '<div style="font-size:8.5px;color:#4f8ba1;margin-top:6px;">' + s.nm + ' has used ' + offsUsed + ' off' + (offsUsed === 1 ? "" : "s") + ' this period so far. Check this if this particular day should count against ' + nextMonthLabel + '\'s allowance instead - it will show as &quot;' + nextMonthLabel + ' OFF&quot; on the grid and won\'t count toward this month\'s total.</div>';

  // Half Day: single worked-time range (bounded by the staff member's own normal shift
  // hours) plus one counter - simpler than the full multi-counter DUTY row since a half
  // day is inherently one continuous stretch at one counter.
  // Deliberately does NOT default from/to to a computed half-shift time - it stays
  // unset ("-- Not set --") until the admin actually picks a time, so the Grid/Monthly
  // display only ever shows a time that was genuinely, manually chosen.
  var halfBounds = shiftTimeBounds(s.sh);
  var halfTimeOpts = constrainedTimeOpts(s.sh);
  var halfData = cd.half || {ctr: "None", from: "", to: ""};
  var halfCtrOpts = ctrOps.map(function(c) {
    return '<option value="' + c + '"' + (halfData.ctr === c ? " selected" : "") + ">" + c + "</option>";
  }).join("");
  function halfTimeSelect(id, val) {
    var opts = '<option value=""' + (!val ? " selected" : "") + '>-- Not set --</option>';
    halfTimeOpts.forEach(function(t) {
      opts += '<option value="' + t + '"' + (val === t ? " selected" : "") + '>' + t + '</option>';
    });
    return '<select id="' + id + '" style="background:#031b28;border:1px solid #0c4a63;color:#9beaff;padding:5px 6px;border-radius:5px;font-size:11px;font-weight:600;outline:none;width:100px;">' + opts + '</select>';
  }
  var halfRow = '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;">'
      + '<select id="ce-half-ctr" style="background:#031b28;border:1px solid #0c4a63;color:#ffd166;padding:5px 6px;border-radius:5px;font-size:11px;font-weight:600;outline:none;flex:1;min-width:80px;">' + halfCtrOpts + "</select>"
      + halfTimeSelect("ce-half-from", halfData.from)
      + '<span style="font-size:10px;color:#86a9bb;">to</span>'
      + halfTimeSelect("ce-half-to", halfData.to)
    + '</div>'
    + '<div style="font-size:8.5px;color:#4f8ba1;margin-bottom:8px;">Pick the actual worked time to show it on the grid - leave as "Not set" to just show HALF DAY with no time. Limited to ' + s.nm + '\'s normal shift hours: ' + minutesToHHMM(halfBounds.start) + ' - ' + minutesToHHMM(halfBounds.end) + '.</div>';

  return '<div role="dialog" aria-modal="true" aria-label="Edit shift for ' + s.nm + '" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;">'
    + '<div style="background:#052232;border:1px solid #147a9e;border-radius:12px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.9);">'

    // Header
    + '<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #0c4a63;">'
      + '<div>'
        + '<div style="font-size:10px;color:#00c2ff;text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;">Edit Cell</div>'
        + '<div style="font-size:14px;font-weight:800;color:#e8f0ff;">' + s.nm + ' &ndash; ' + dDay(ec.d) + ' ' + dLabel(ec.d) + '</div>'
      + '</div>'
      + '<button id="ce-close" style="background:#1a0a0a;border:1px solid #7f1d1d;color:#ff5d7a;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;">Close</button>'
    + '</div>'

    // Body
    + '<div style="padding:16px;">'

      // Status
      + '<div style="margin-bottom:14px;">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Status</div>'
        + '<div style="display:flex;flex-wrap:wrap;gap:6px;">' + statBtns + '</div>'
      + '</div>'

      // Off day notes (only when OFF) - lets an off day taken early be counted against
      // next month's allowance instead of this month's
      + '<div id="ce-off-row" style="margin-bottom:14px;' + (!isOff ? "display:none;" : "") + '">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Off Day Notes</div>'
        + nextMonthCheckbox
      + '</div>'

      // Branch (only when DUTY or HALFDAY - which branch this staff member works in today)
      + '<div id="ce-branch-row" style="margin-bottom:14px;' + (!isDuty && !isHalf ? "display:none;" : "") + '">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Working Branch' + (s.xbr ? ' - <span style="color:#7dd3fc;">Cross-Branch Reliever</span>' : '') + '</div>'
        + branchSel
      + '</div>'

      // Shift (only when DUTY)
      + '<div id="ce-shift-row" style="margin-bottom:14px;' + (!isDuty ? "display:none;" : "") + '">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Duty Shift</div>'
        + shiftSel
      + '</div>'

      // Counters (only when DUTY)
      + '<div id="ce-ctrs-row" style="margin-bottom:14px;' + (!isDuty ? "display:none;" : "") + '">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Counter Assignment</div>'
        + multiCtrCheckbox
        + '<div id="ce-main-ctr-row" style="' + (multiCtr ? "display:none;" : "") + '">'
          + '<div style="font-size:8.5px;color:#4f8ba1;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;">Main Counter</div>'
          + mainCtrSel
        + '</div>'
        + '<div id="ce-multi-ctr-row" style="' + (multiCtr ? "" : "display:none;") + '">'
          + timeHint
          + ctrRows
          + addCtrBtn
        + '</div>'
      + '</div>'

      // Half Day worked time + counter (only when HALFDAY)
      + '<div id="ce-half-row" style="' + (!isHalf ? "display:none;" : "") + '">'
        + '<div style="font-size:9px;color:#86a9bb;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px;">Worked Time &amp; Counter</div>'
        + halfRow
      + '</div>'

    + '</div>'

    // Footer
    + '<div style="display:flex;gap:8px;justify-content:flex-end;padding:14px 16px;border-top:1px solid #0c4a63;">'
      + '<button id="ce-cancel" style="background:#111827;border:1px solid #0c4a63;color:#86a9bb;padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;">Cancel</button>'
      + '<button id="ce-save" style="background:#1a3a6e;border:1px solid #00c2ff;color:#9beaff;padding:8px 20px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">Save</button>'
    + '</div>'

    + '</div></div>';
}

function vstaff() {
  var b = (ST.grp === 0) ? ST.staff.slice() : ST.staff.filter(function(s) { return s.g === ST.grp; });
  if (ST.sort === "name") {
    b.sort(function(a, c) { return a.nm < c.nm ? -1 : a.nm > c.nm ? 1 : 0; });
  } else if (ST.sort === "shift") {
    b.sort(function(a, c) {
      var d = shOrd(a.sh) - shOrd(c.sh);
      return d !== 0 ? d : (a.nm < c.nm ? -1 : 1);
    });
  } else if (ST.sort === "counter") {
    b.sort(function(a, c) {
      var days = wkDays(ST.week), ac = "", bc = "";
      for (var i = days.length - 1; i >= 0; i--) {
        if (!ac) { var v = getC(a.id, days[i]); if (v && v !== "None") ac = v; }
        if (!bc) { var v2 = getC(c.id, days[i]); if (v2 && v2 !== "None") bc = v2; }
      }
      if (ac < bc) return -1; if (ac > bc) return 1;
      return a.nm < c.nm ? -1 : 1;
    });
  }
  return b;
}

// --- SAVE / LOAD ---
// Generic: swap two entries (matched by idKey) inside arr, based on their positions
// within listIds (the currently *visible* ordered list a reorder button belongs to).
function reorderArrayItem(arr, idKey, id, dir, listIds) {
  var pos = listIds.indexOf(id);
  var targetPos = pos + dir;
  if (pos < 0 || targetPos < 0 || targetPos >= listIds.length) return false;
  var otherId = listIds[targetPos];
  var i1 = -1, i2 = -1;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i][idKey] === id) i1 = i;
    if (arr[i][idKey] === otherId) i2 = i;
  }
  if (i1 < 0 || i2 < 0) return false;
  var tmp = arr[i1]; arr[i1] = arr[i2]; arr[i2] = tmp;
  return true;
}

// Reorder a staff member up/down within whichever visible list (listIds) the button was shown in.
function moveStaff(id, dir, listIds) {
  if (!listIds || !listIds.length) return;
  pushUndo();
  if (reorderArrayItem(ST.staff, "id", id, dir, listIds)) {
    ST.sort = "default"; // make the new order visible immediately everywhere
    render();
  } else {
    ST.undoStack.pop(); // no actual change happened - don't leave a no-op entry behind
  }
}

// Reorder a counter row (Coverage tab) up/down within its side group (Front/Back).
function moveCounter(id, dir, listIds) {
  if (!listIds || !listIds.length) return;
  pushUndo();
  if (reorderArrayItem(CTRS_DATA, "id", id, dir, listIds)) render();
  else ST.undoStack.pop();
}

function getSave() {
  return {
    v: 4, ts: Date.now(), rosterVersion: ROSTER_VERSION,
    staff: ST.staff, sched: ST.sched, assign: ST.assign,
    titles: ST.titles, note: ST.note,
    week: ST.week, tab: ST.tab, grp: ST.grp, sort: ST.sort, selDay: ST.selDay, cells: ST.cells,
    tabOrder: ST.tabOrder, ctrsData: CTRS_DATA,
    rangeStart: ST.rangeStart, rangeEnd: ST.rangeEnd,
    shiftDefs: SD, hdrCollapsed: ST.hdrCollapsed
  };
}

function applySave(d) {
  if (!d || d.v < 4) return false;
  var rosterMatches = (d.rosterVersion === ROSTER_VERSION);
  if (rosterMatches) {
    // Same roster this save was made against - safe to restore staff/schedule/cells as-is.
    ST.staff  = d.staff  || ST.staff;
    ST.sched  = d.sched  || ST.sched;
    ST.assign = d.assign || {};
    ST.cells  = d.cells  || {};
  } else {
    // Saved against an older (or unknown) roster. Staff IDs may now refer to different
    // people entirely - restoring that sched/cells data would silently show the wrong
    // shifts/edits against the current roster. Keep the fresh built-in roster and
    // regenerate a clean schedule for it instead.
    ST.sched = generateSchedule();
    ST.assign = {};
    ST.cells = {};
    ST.rosterJustMigrated = true;
  }
  if (d.titles) ST.titles = d.titles;
  if (d.note)   ST.note   = d.note;
  ST.week   = d.week   || 1;
  ST.tab    = "live"; // always land on the Live screen when a file is opened, regardless of what was last saved
  ST.grp    = d.grp    || 0;
  ST.sort   = d.sort   || "default";
  ST.selDay = d.selDay || null;
  if (d.tabOrder && d.tabOrder.length) ST.tabOrder = d.tabOrder;
  if (d.ctrsData && d.ctrsData.length) CTRS_DATA = d.ctrsData;
  if (d.shiftDefs && Object.keys(d.shiftDefs).length) SD = d.shiftDefs;
  ST.hdrCollapsed = !!d.hdrCollapsed;
  if (d.rangeStart && d.rangeEnd) {
    ST.rangeStart = d.rangeStart;
    ST.rangeEnd = d.rangeEnd;
    ST.rangeDraftStart = d.rangeStart;
    ST.rangeDraftEnd = d.rangeEnd;
    recomputeRange();
  }
  lastSaved = d.ts     || null;
  return true;
}

function autoLoad() {

}

// Debounced autosave triggered after every schedule/staff edit (render call)

// If a write ever fails (quota, permission, disk error) push the user toward the
// download + upload-to-continue workflow so no work is lost.
function offerFallbackAfterSaveFailure(e) {
  if (window.__schedFallbackShown) return; // don't spam repeated failures
  window.__schedFallbackShown = true;
  setTimeout(function() { window.__schedFallbackShown = false; }, 60000);
  if (confirm("Auto-save failed (" + (e && e.message ? e.message : "unknown error") + ").\n\nDownload a backup .json file now so you can continue later with 'Upload File to Continue'?")) {
    exportJSON();
  }
}

// --- FILE SYSTEM ACCESS: pick a real save location on disk ---
function fsApiSupported() { return !!window.showSaveFilePicker; }

function chooseSaveLocation() {

}

function writeToChosenFile(showFlash) {
  if (!FS_HANDLE) return;
  FS_HANDLE.createWritable().then(function(writable) {

  }).then(function() {

function loadLocal() {

    }

// Saves a generated file for the viewer. Tries the claude.ai "downloads" capability first
// (the plain <a download> trick below is inert inside a published artifact page); falls
// back to it when the capability isn't there at all - opened as a plain local HTML file,
// or in a normal browser tab - so this one helper works in both contexts unchanged.
async function saveFile(filename, blob) {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      var downloads = await window.claude.use("downloads");
      if (downloads) {
        await downloads.save({filename: filename, data: blob});
        return true;
      }
    }
  } catch (e) {
    if (e && e.code === "declined") return false; // viewer said no - respect it, don't fall back
    // any other rejection (unavailable, rate_limited, etc.) - fall through to the plain link
  }
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    return true;
  } catch (e2) {
    return false;
  }
}

async function exportJSON() {
  var dt = new Date();
  var mn = dt.getMonth() + 1;
  var dd = dt.getDate();
  var fn = "schedule_" + dt.getFullYear() + (mn < 10 ? "0" : "") + mn + (dd < 10 ? "0" : "") + dd + ".json";
  var blob = new Blob([JSON.stringify(getSave(), null, 2)], {type: "application/json"});
  var ok = await saveFile(fn, blob);
  if (!ok) return;
  try { localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); } catch(e) {}
  ST.showBackupBanner = false;
  flashSave("Exported!", "#052e16", "#16a34a", "#4ade80");
}

// "Upload File to Continue" - resume work from any previously saved/downloaded backup
function importJSON() {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = function() {
    var f = inp.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var d = JSON.parse(e.target.result);
        if (applySave(d)) {
          localStorage.setItem(SAVE_KEY, JSON.stringify(d));
          logChange("Data replaced via file upload", f.name);
          render();
          setTimeout(function() { flashSave("Imported!", "#052e16", "#16a34a", "#4ade80"); }, 80);
        } else { alert("Invalid or outdated file."); }
      } catch(err) { alert("Error: " + err.message); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

function flashSave(txt, bg, bc, col) {

  var oi = b.innerHTML, os = b.getAttribute("data-os") || "";

  setTimeout(function() {

// Auto-assign counters per day for a given schedule object.
// Which counter ids are "MAIN" (must-always-be-staffed) per the Coverage tab's own data -
// computed fresh each call since counters can be reordered/renamed and CTRS_DATA can reload from a save.
function getMainCounterIds() {
  return CTRS_DATA.filter(function(c) { return c.nm && c.nm.indexOf("MAIN") >= 0; }).map(function(c) { return c.id; });
}

// A single "envelope" interval [start,end] in minutes covering a whole shift (split shifts use
// first-clock-in to last-clock-out) - used for display/UI bounds (e.g. counter-time pickers).
function shiftEnvelope(shCode) {
  var b = shiftTimeBounds(shCode);
  return [b.start, b.end];
}
function intervalsOverlap(a, b) { return a[0] < b[1] && b[0] < a[1]; }
// True if any interval in listA overlaps any interval in listB - used for real (not envelope)
// overlap checks so a split shift's off-duty gap (e.g. 08:00-14:30 / 18:30-22:30) never
// falsely "occupies" a counter during the hours in between.
function anyOverlap(listA, listB) {
  for (var i = 0; i < listA.length; i++) {
    for (var j = 0; j < listB.length; j++) {
      if (intervalsOverlap(listA[i], listB[j])) return true;
    }
  }
  return false;
}

// Auto-assign counters per day for a given schedule object, guaranteeing:
//  - No two staff ever share the same counter at overlapping times (no double-booking, ever).
//  - MAIN counters (C1,C3,C5,C7,C9 - must always be staffed) are filled before other counters.
//  - CS is reserved for CS-role staff first; if CS is already taken for that window, a CS-role
//    reliever is simply given a free regular counter instead (never forced to double up on CS).
//  - Split shifts are checked against their real working segments, not a blanket envelope, so
//    the gap between segments doesn't waste a counter that's actually free at that time.
//  - If there are genuinely more overlapping staff than counters, the extra staff are left
//    unassigned ("Unassigned" / no counter shown) rather than sharing someone else's counter.
// When honorCellOverrides is true, a per-day OFF/ABSENT override set via the cell editor
// (ST.cells) takes priority over the base schedule, so counters stay accurate automatically.
function generateCounters(schedObj, honorCellOverrides, reliefMap) {
  var newAssign = {};
  var mainIds = getMainCounterIds();
  for (var d = 0; d < TOTAL_DAYS; d++) {
    if (!isInMonth(d)) continue;
    [1, 2, 3].forEach(function(gid) {
      var allOpts = ctrOpts(gid);
      var numOpts = allOpts.filter(function(c) { return c !== "None" && c !== "CS"; });
      var hasCS = allOpts.indexOf("CS") >= 0;

      // MAIN counters first (in their existing order), then the rest - so MAIN gets priority fill.
      var counterOrder = numOpts.slice().sort(function(a, b) {
        var am = mainIds.indexOf(a) >= 0 ? 0 : 1, bm = mainIds.indexOf(b) >= 0 ? 0 : 1;
        if (am !== bm) return am - bm;
        return numOpts.indexOf(a) - numOpts.indexOf(b);
      });

      // Effective branch (auto-relief always applies since it's freshly computed from
      // this same schedule; manual cd.branch overrides only apply when honoring cell
      // overrides, i.e. the live schedule, since a fresh preview shouldn't be affected
      // by old manual edits from a different schedule state).
      var gs = ST.staff.filter(function(s) { return getEffectiveBranch(s.id, d, reliefMap, honorCellOverrides) === gid; });
      var working = [];
      gs.forEach(function(s) {
        var sh = getEffectiveShift(s.id, d, schedObj, reliefMap, honorCellOverrides) || s.sh;
        if (honorCellOverrides) {
          var cd = getCellData(s.id, d);
          if (cd.status === "OFF" || cd.status === "ABSENT" || cd.status === "NODUTY" || cd.status === "VACATION") sh = cd.status;
        }
        if (sh === "OFF" || sh === "ABSENT" || sh === "NODUTY" || sh === "VACATION") return;
        var ivs = parseShiftRanges(sh);
        if (!ivs.length) ivs = [shiftEnvelope(sh)];
        working.push({s: s, ivs: ivs, start: ivs[0][0]});
      });

      // CS-role staff first (so they get first crack at CS), then earliest start-time first -
      // a stable, predictable fill order that maximizes non-overlapping coverage.
      working.sort(function(a, b) {
        var ac = a.s.cs ? 0 : 1, bc = b.s.cs ? 0 : 1;
        if (ac !== bc) return ac - bc;
        // Among CS-flagged staff, the fixed CS person takes priority over their reliever
        // when both are working - the reliever's role is to cover when the fixed person
        // is absent, not to double up on CS when the fixed person is already there.
        if (a.s.cs && b.s.cs) {
          var arel = a.s.csr ? 1 : 0, brel = b.s.csr ? 1 : 0;
          if (arel !== brel) return arel - brel;
        }
        return a.start - b.start;
      });

      var occupied = {};
      counterOrder.forEach(function(cid) { occupied[cid] = []; });
      if (hasCS) occupied.CS = [];
      // CS coverage runs as two independent slots (AM / PM) rather than one whole-day
      // resource. Without this, an early shift (e.g. 08:00 start) claiming CS for its
      // entire span would permanently block a later shift (e.g. 14:30 start) from ever
      // getting CS that day, since their hours technically overlap during the handoff -
      // even though they're really covering two separate parts of the day.
      var csSlotTaken = {AM: false, PM: false};

      working.forEach(function(item) {
        var s = item.s, ivs = item.ivs, assigned = null;
        if (s.cs && hasCS) {
          var bucket = (item.start < 720) ? "AM" : "PM";
          if (!csSlotTaken[bucket]) { assigned = "CS"; csSlotTaken[bucket] = true; }
        }
        if (!assigned) {
          for (var i = 0; i < counterOrder.length; i++) {
            var cid = counterOrder[i];
            if (!anyOverlap(ivs, occupied[cid])) { assigned = cid; break; }
          }
        }
        if (assigned) {
          occupied[assigned] = occupied[assigned].concat(ivs);
          newAssign[s.id + "_" + d] = assigned;
        }
        // else: genuinely no free counter for this overlap window - leave unassigned rather than double-book
      });
    });
  }
  return newAssign;
}

// Keeps ST.assign (the counter layer) automatically in sync with the LIVE schedule at all
// times - runs on every render, so counters never need a manual "Generate" click to appear
// or to catch up after a shift/status edit. Cheap enough (tiny dataset) to run continuously.
function refreshLiveCounters() {
  ST.autoRelief = computeAutoRelief(ST.sched);
  ST.assign = generateCounters(ST.sched, true, ST.autoRelief);
}

// Generate builds a preview (does NOT touch the live Grid schedule) and jumps to
// Monthly tab so it can be reviewed, then applied or discarded from there.
function doGenerate() {
  ST.previewSched = generateSchedule();
  ST.previewAutoRelief = computeAutoRelief(ST.previewSched);
  ST.previewAssign = generateCounters(ST.previewSched, false, ST.previewAutoRelief);
  ST.tab = "monthly";
  var btn = document.getElementById("gen");
  if (btn) {
    btn.textContent = "Generated!";
    btn.style.background = "#073a50";
    btn.style.borderColor = "#0891b2";
    btn.style.color = "#cffafe";
    setTimeout(function() { render(); }, 700);
  } else {
    render();
  }
}

// Push the previewed (generated) schedule + counters live into the Grid and everywhere else.
function applyGenerated() {
  if (!ST.previewSched) return;
  pushUndo();
  ST.sched = ST.previewSched;
  ST.assign = ST.previewAssign || {};
  ST.previewSched = null;
  ST.previewAssign = null;
  ST.previewAutoRelief = null;
  // Clear manual per-cell overrides (Off/Absent/Half Day edits, and any manual branch
  // reassignments) from before this regeneration - they belong to the old schedule,
  // not this new one, and leaving them in place would make it look like Generate
  // produces Half Day/branch changes/etc on its own.
  ST.cells = {};
  logChange("Schedule regenerated", ST.rangeStart + " to " + ST.rangeEnd);
  render();
  setTimeout(function() { flashSave("Applied!", "#052e16", "#16a34a", "#4ade80"); }, 80);
}

// Throw away the previewed schedule; the live Grid schedule is untouched.
function discardGenerated() {
  ST.previewSched = null;
  ST.previewAssign = null;
  ST.previewAutoRelief = null;
  render();
}

// Reconfigure the working schedule period from a user-chosen start/end date.
// This regenerates the schedule for the new period (old per-day cell edits don't
// correspond to the new calendar days, so they're cleared along with it).
// Deliberately avoids confirm()/alert() - those can be silently blocked in some
// embedded/sandboxed preview contexts, which makes the button look like it does nothing.
function applyDateRange(newStart, newEnd) {
  ST.rangeDraftStart = newStart || ST.rangeDraftStart;
  ST.rangeDraftEnd = newEnd || ST.rangeDraftEnd;
  if (!newStart || !newEnd) { ST.rangeError = "Please choose both a start and an end date."; render(); return; }
  var s = parseISODate(newStart), e = parseISODate(newEnd);
  if (isNaN(s.getTime()) || isNaN(e.getTime())) { ST.rangeError = "Please choose valid dates."; render(); return; }
  if (e < s) { ST.rangeError = "End date must be on or after the start date."; render(); return; }
  pushUndo();
  ST.rangeStart = newStart;
  ST.rangeEnd = newEnd;
  ST.rangeError = null;
  recomputeRange();
  ST.week = 1;
  ST.selDay = null;
  ST.cells = {};
  ST.previewSched = null;
  ST.previewAssign = null;
  ST.sched = generateSchedule();
  ST.rangeJustApplied = true;
  render();
  scheduleAutosave();
}

function csvEscape(val) {
  var s = String(val === null || val === undefined ? "" : val);
  if (s.indexOf(",") !== -1 || s.indexOf('"') !== -1 || s.indexOf("\n") !== -1) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
// One row per staff per day across the whole selected period - detailed enough to
// cross-check against payroll directly, rather than just a weekly summary.
async function exportHoursCSV() {
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  var rows = [["Staff Name", "Branch", "Date", "Day", "Status", "Shift Code", "Shift Time", "Hours", "Counter"]];
  ST.staff.forEach(function(s) {
    var g = GROUPS[s.g] || {nm: "?"};
    for (var d = 0; d < TOTAL_DAYS; d++) {
      var dt = getDate(d);
      var dateLabel = (dt.getMonth() + 1) + "/" + dt.getDate() + "/" + dt.getFullYear();
      var sh = getEffectiveShift(s.id, d, ST.sched) || s.sh;
      var cd = getCellData(s.id, d);
      var eff = (cd.status === "OFF" || cd.status === "ABSENT" || cd.status === "HALFDAY" || cd.status === "NODUTY" || cd.status === "VACATION") ? cd.status : sh;
      var status, shiftCode = "", shiftTime = "", hours = 0, ctr = "";
      if (eff === "OFF") {
        status = cd.nextMonthOff ? (nextMonthLabelFor(d) + " OFF") : "OFF";
      } else if (eff === "ABSENT") {
        status = "ABSENT";
      } else if (eff === "NODUTY") {
        status = "NO DUTY";
      } else if (eff === "VACATION") {
        status = "VACATION";
      } else if (eff === "HALFDAY") {
        status = "HALF DAY";
        shiftCode = "HALFDAY";
        if (cd.half && cd.half.from && cd.half.to) {
          shiftTime = cd.half.from + "-" + cd.half.to;
          hours = (timeToMinutes(cd.half.to) - timeToMinutes(cd.half.from)) / 60;
          ctr = cd.half.ctr || "";
        }
      } else {
        status = "DUTY";
        shiftCode = eff;
        shiftTime = SD[eff] ? SD[eff].t : "";
        hours = hoursForShiftCode(eff);
        var manual = (cd.ctrs && cd.ctrs.length) ? cd.ctrs.filter(function(c) { return c && c.ctr && c.ctr !== "None"; }).map(function(c) { return c.ctr; }).join("+") : "";
        ctr = manual || getC(s.id, d) || "";
      }
      rows.push([s.nm, g.nm, dateLabel, DOW[dt.getDay()], status, shiftCode, shiftTime, hours ? hours.toFixed(2) : "0", ctr]);
    }
  });
  var csv = rows.map(function(r) { return r.map(csvEscape).join(","); }).join("\r\n");
  var blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
  await saveFile("schedule-hours-" + periodLabel().replace(/[^a-z0-9]+/gi, "-") + ".csv", blob);
}

// --- REAL PDF FILE DOWNLOAD (html2canvas + jsPDF) ---
function pdfInfoMsg(html, isError) {
  var info = document.getElementById("sched-print-info");
  if (!info) return;
  info.innerHTML = html;
  info.style.cssText = isError
    ? "background:#450a0a;border-bottom:2px solid #7f1d1d;padding:8px 14px;font-size:11px;color:#fca5a5;"
    : "background:#f0f9ff;border-bottom:2px solid #bfdbfe;padding:8px 14px;font-size:11px;color:#1e40af;";
}
function downloadPDFFromPreview(btnEl) {
  var content = document.getElementById("sched-print-content");
  var overlay = document.getElementById("sched-print-overlay");
  if (!content) return;
  if (typeof html2canvas === "undefined" || !window.jspdf) {
    pdfInfoMsg("PDF engine failed to load (no internet connection to cdnjs.cloudflare.com). Use <b>Print</b> and choose 'Save as PDF' instead.", true);
    return;
  }
  var ori = (overlay && overlay.dataset.ori === "portrait") ? "portrait" : "landscape";
  var origTxt = btnEl ? btnEl.textContent : "";
  if (btnEl) { btnEl.textContent = "Generating..."; btnEl.disabled = true; }

  var clone = null;
  var cleanup = function() { if (clone && clone.parentNode) clone.parentNode.removeChild(clone); };
  var fail = function(msg) {
    cleanup();
    pdfInfoMsg(msg, true);
    if (btnEl) { btnEl.textContent = origTxt; btnEl.disabled = false; }
  };

  try {
    // Capture from an isolated, fully-expanded, off-screen clone rather than the live
    // preview element. The live element sits inside a position:fixed overlay with its
    // own internal scroll, and html2canvas is unreliable capturing that combination
    // (it can produce blank or cut-off images, especially on mobile).
    // Clone width + scale together target roughly 300 DPI on the printed page - the
    // combination that actually determines sharpness, not either number alone.
    clone = document.createElement("div");
    clone.innerHTML = content.innerHTML;
    clone.style.cssText = "position:absolute;top:0;left:-99999px;width:" + (ori === "landscape" ? "1400px" : "1000px") + ";background:#ffffff;padding:8px;";
    document.body.appendChild(clone);

    html2canvas(clone, {scale: 2.5, backgroundColor: "#ffffff", useCORS: true, windowWidth: clone.scrollWidth, windowHeight: clone.scrollHeight}).then(function(canvas) {
      try {
        cleanup();
        var jsPDFCtor = window.jspdf.jsPDF;
        var pdf = new jsPDFCtor({orientation: ori, unit: "mm", format: "a4"});
        var pageW = pdf.internal.pageSize.getWidth();
        var pageH = pdf.internal.pageSize.getHeight();
        var imgW = pageW;
        var imgH = (canvas.height * imgW) / canvas.width;
        // PNG (lossless) instead of JPEG - this content is text/lines/tables, not
        // photographic, so PNG avoids the soft/blocky compression artifacts JPEG
        // introduces around sharp edges and small text.
        var imgData = canvas.toDataURL("image/png");

        if (imgH <= pageH) {
          pdf.addImage(imgData, "PNG", 0, 0, imgW, imgH);
        } else {
          // Slice the tall canvas across multiple A4 pages
          var pageCanvasH = Math.floor((canvas.width * pageH) / imgW);
          var y = 0, first = true;
          while (y < canvas.height) {
            var sliceH = Math.min(pageCanvasH, canvas.height - y);
            var sliceCanvas = document.createElement("canvas");
            sliceCanvas.width = canvas.width;
            sliceCanvas.height = sliceH;
            var ctx = sliceCanvas.getContext("2d");
            ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
            var sliceData = sliceCanvas.toDataURL("image/png");
            var sliceImgH = (sliceH * imgW) / canvas.width;
            if (!first) pdf.addPage();
            pdf.addImage(sliceData, "PNG", 0, 0, imgW, sliceImgH);
            first = false;
            y += sliceH;
          }
        }
        var dt = new Date();
        var mn = dt.getMonth() + 1, dd = dt.getDate();
        var fn = "cashier_schedule_" + dt.getFullYear() + (mn < 10 ? "0" : "") + mn + (dd < 10 ? "0" : "") + dd + "_" + dt.getHours() + "" + dt.getMinutes() + ".pdf";
        saveFile(fn, pdf.output("blob")).then(function(ok) {
          if (!ok) { if (btnEl) { btnEl.textContent = origTxt; btnEl.disabled = false; } return; }
          pdfInfoMsg("PDF saved as <b>" + fn + "</b>. Check your device's Downloads.", false);
          if (btnEl) { btnEl.textContent = "Saved!"; setTimeout(function() { btnEl.textContent = origTxt; btnEl.disabled = false; }, 1500); }
        });
      } catch (err2) {
        fail("PDF generation failed: " + (err2 && err2.message ? err2.message : "unknown error") + ". Try <b>Print</b> and choose 'Save as PDF' instead.");
      }
    }).catch(function(err) {
      fail("PDF generation failed: " + (err && err.message ? err.message : "unknown error") + ". Try <b>Print</b> and choose 'Save as PDF' instead.");
    });
  } catch (err0) {
    fail("PDF generation failed to start: " + (err0 && err0.message ? err0.message : "unknown error") + ". Try <b>Print</b> and choose 'Save as PDF' instead.");
  }
}

function q(id) { return document.getElementById(id); }

// Custom logo: stored separately from the main schedule save data so a large
// image doesn't compete with schedule data for localStorage quota, and
// resized down before storing so it stays small regardless of the source
// file size.
var LOGO_KEY = "sched_3g_v4_logo";
function getCurrentLogoURI() {
  try {
    var custom = localStorage.getItem(LOGO_KEY);
    return custom || LOGO_URI;
  } catch (e) {
    return LOGO_URI;
  }
}
function setCustomLogo(file) {
  if (!file || file.type.indexOf("image/") !== 0) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var img = new Image();
    img.onload = function() {
      var maxDim = 220;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      try {
        localStorage.setItem(LOGO_KEY, canvas.toDataURL("image/png"));
        render();
      } catch (e) {
        alert("Couldn't save the new logo (storage full). Try a smaller image.");
      }
    };
    img.onerror = function() { alert("That file couldn't be read as an image."); };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
